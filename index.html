<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de bord</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fafaf8">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf8;--bg2:#f2f1ed;--bg3:#e8e7e2;
  --text:#18181a;--text2:#6b6b67;--text3:#9b9b96;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.22);
  --r:8px;--rl:12px;
  --info-bg:#e6f1fb;--info-text:#185fa5;--info-border:#b5d4f4;
  --warn-bg:#faeeda;--warn-text:#854f0b;--warn-border:#fac775;
  --ok:#1d9e75;--danger:#e24b4a;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#16161a;--bg2:#1e1e24;--bg3:#26262e;
  --text:#f0eff0;--text2:#9b9b96;--text3:#6b6b67;
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.22);
  --info-bg:#0c3a6b;--info-text:#85b7eb;--info-border:#185fa5;
  --warn-bg:#4a2d08;--warn-text:#fac775;--warn-border:#854f0b;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:740px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:80px}
.app-header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border);flex-wrap:wrap;gap:8px}
.app-title{font-family:'DM Serif Display',serif;font-size:22px;letter-spacing:-0.3px}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.app-date{font-size:12px;color:var(--text2)}
.drive-btn{border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);padding:5px 10px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.drive-btn:hover{background:var(--bg2)}
.drive-btn.connected{background:var(--info-bg);border-color:var(--info-border);color:var(--info-text)}

/* ─── QUICK ENTRY ─── */
.quick-fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--text);color:var(--bg);border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.22);z-index:100;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.quick-fab:hover{transform:scale(1.08)}
.quick-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
.quick-overlay.open{display:flex}
.quick-modal{background:var(--bg);border-radius:var(--rl) var(--rl) 0 0;width:100%;max-width:740px;padding:20px 20px 32px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow-y:auto}
.quick-title{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:2px}
.quick-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);align-self:flex-end;margin-bottom:-8px}
.quick-section{display:flex;flex-direction:column;gap:6px}
.quick-lbl{font-size:12px;color:var(--text2);font-weight:500}
.quick-mood-row{display:flex;gap:6px;flex-wrap:wrap}
.qmb{border:0.5px solid var(--border);border-radius:var(--r);padding:6px 10px;font-size:13px;cursor:pointer;background:none;color:var(--text);font-family:'DM Sans',sans-serif;flex:1;text-align:center}
.qmb:hover{background:var(--bg2)}
.qmb.sel-vl{background:#fcebeb!important;border-color:#e24b4a!important;color:#a32d2d!important}
.qmb.sel-l{background:#fcebeb!important;border-color:#f09595!important;color:#791f1f!important}
.qmb.sel-n{background:var(--bg2)!important;border-color:#888780!important}
.qmb.sel-g{background:#eaf3de!important;border-color:#639922!important;color:#3b6d11!important}
.qmb.sel-vg{background:#e1f5ee!important;border-color:#1d9e75!important;color:#0f6e56!important}
.qmb.sel-h{background:#faeeda!important;border-color:#ba7517!important;color:#854f0b!important}
.quick-save-btn{background:var(--text);color:var(--bg);border:none;border-radius:var(--r);padding:12px;font-size:14px;cursor:pointer;font-weight:500;font-family:'DM Sans',sans-serif;margin-top:4px}
.quick-save-btn:hover{opacity:.85}

/* ─── SEARCH ─── */
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.search-input{flex:1;font-size:13px;padding:7px 11px;border:0.5px solid var(--border);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
.search-input:focus{outline:none;border-color:var(--border2)}
.search-btn{padding:7px 14px;border:0.5px solid var(--border2);border-radius:var(--r);background:none;cursor:pointer;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif}
.search-result{background:var(--bg2);border-radius:var(--r);padding:10px 13px;margin-bottom:6px;cursor:pointer;border:0.5px solid var(--border)}
.search-result:hover{border-color:var(--border2)}
.search-result-date{font-size:11px;color:var(--text2);margin-bottom:3px}
.search-result-snippet{font-size:13px}
.search-highlight{background:#faeeda;border-radius:2px;padding:0 2px}

/* ─── HEATMAP ─── */
.heatmap-wrap{overflow-x:auto;padding-bottom:4px}
.heatmap-grid{display:flex;gap:3px}
.heatmap-week{display:flex;flex-direction:column;gap:3px}
.hm-cell{width:13px;height:13px;border-radius:2px;cursor:pointer;flex-shrink:0}
.heatmap-months{display:flex;gap:0;margin-bottom:4px;font-size:10px;color:var(--text3)}

/* ─── RADAR CAPES ─── */
.radar-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.radar-theme{background:var(--bg2);border-radius:var(--r);padding:10px 12px}
.radar-theme-label{font-size:12px;font-weight:500;margin-bottom:6px}
.radar-bar-row{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:11px}
.radar-bar-fill{height:6px;border-radius:3px}

/* ─── BADGES ─── */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.badge-card{border:0.5px solid var(--border);border-radius:var(--r);padding:10px 12px;text-align:center;position:relative}
.badge-card.unlocked{border-color:#97c459;background:#eaf3de}
.badge-card.locked{opacity:.45}
.badge-icon{font-size:24px;margin-bottom:4px}
.badge-name{font-size:12px;font-weight:500}
.badge-crit{font-size:11px;color:var(--text2);margin-top:2px}
.badge-date{font-size:10px;color:#639922;margin-top:2px}

/* ─── DEADLINES BANNER ─── */
.deadlines-banner{background:var(--warn-bg);border-bottom:0.5px solid var(--warn-border);padding:8px 20px;display:none}
.deadline-item{font-size:12px;color:var(--warn-text);display:flex;align-items:center;gap:8px;padding:2px 0}
.deadline-badge{background:var(--warn-text);color:var(--warn-bg);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:500}

/* ─── TABS ─── */
.tabs{display:flex;border-bottom:0.5px solid var(--border);padding:0 20px;overflow-x:auto}
.tab{padding:10px 13px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--text);border-bottom:2px solid var(--text);font-weight:500}
.panel{display:none;padding:16px 20px}.panel.active{display:block}

/* ─── CALENDAR ─── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{background:none;border:0.5px solid var(--border2);border-radius:var(--r);padding:6px 12px;cursor:pointer;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif}
.cal-nav-btn:hover{background:var(--bg2)}
.month-label{font-family:'DM Serif Display',serif;font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-header{text-align:center;font-size:11px;color:var(--text2);padding:4px 0;font-weight:500}
.cal-day{border:0.5px solid var(--border);border-radius:var(--r);padding:5px;min-height:64px;cursor:pointer;background:var(--bg);transition:border-color .15s;position:relative}
.cal-day:hover{border-color:var(--border2)}
.cal-day.empty{background:none;border-color:transparent;cursor:default}
.cal-day.today{border-color:var(--info-border);background:var(--info-bg)}
.cal-day.selected{border-color:var(--text);border-width:1.5px}
.cal-day.has-deadline{border-color:#e24b4a}
.deadline-dot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#e24b4a}
.day-num{font-size:11px;font-weight:500;margin-bottom:3px}
.day-dots{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:2px}
.dot{width:5px;height:5px;border-radius:50%}
.day-stars{font-size:9px;letter-spacing:-1px}
.star-q-on{color:#ba7517}.star-q-off{color:var(--border2)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:3px}

/* ─── SHEET ─── */
.back-btn{background:none;border:0.5px solid var(--border);border-radius:var(--r);padding:6px 13px;font-size:13px;cursor:pointer;color:var(--text2);margin-bottom:12px;font-family:'DM Sans',sans-serif}
.back-btn:hover{background:var(--bg2)}
.sheet-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.sheet-date{font-family:'DM Serif Display',serif;font-size:20px}
.sheet-quality{display:flex;align-items:center;gap:8px}
.quality-stars{font-size:20px;cursor:pointer}
.quality-lbl{font-size:11px;color:var(--text2)}

/* ─── SECTIONS ─── */
.section{border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;cursor:pointer;background:var(--bg2);user-select:none}
.sec-head:hover{background:var(--bg3)}
.sec-title{font-size:13px;font-weight:500}
.sec-arrow{font-size:11px;color:var(--text3);transition:transform .2s}
.sec-body{padding:12px 13px;display:none;flex-direction:column;gap:9px;border-top:0.5px solid var(--border)}
.sec-body.open{display:flex}
.sec-tabs{display:flex;gap:4px;margin-bottom:8px}
.sec-tab{border:0.5px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;background:none;color:var(--text2);font-family:'DM Sans',sans-serif}
.sec-tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ─── FORM ─── */
.fl{display:flex;flex-direction:column;gap:4px}
.lbl{font-size:12px;color:var(--text2)}
input[type=text],input[type=number],input[type=time],input[type=date],textarea,select{
  width:100%;font-size:13px;padding:6px 9px;
  border:0.5px solid var(--border);border-radius:var(--r);
  background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--border2)}
textarea{resize:vertical;min-height:56px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

/* ─── MOOD / CHIPS ─── */
.mood-btns{display:flex;gap:5px;flex-wrap:wrap}
.mb{border:0.5px solid var(--border);border-radius:var(--r);padding:4px 9px;font-size:12px;cursor:pointer;background:none;color:var(--text);font-family:'DM Sans',sans-serif}
.mb:hover{background:var(--bg2)}
.sel-vl{background:#fcebeb!important;border-color:#e24b4a!important;color:#a32d2d!important}
.sel-l{background:#fcebeb!important;border-color:#f09595!important;color:#791f1f!important}
.sel-n{background:var(--bg2)!important;border-color:#888780!important}
.sel-g{background:#eaf3de!important;border-color:#639922!important;color:#3b6d11!important}
.sel-vg{background:#e1f5ee!important;border-color:#1d9e75!important;color:#0f6e56!important}
.sel-h{background:#faeeda!important;border-color:#ba7517!important;color:#854f0b!important}
.sel-ok{background:var(--bg2)!important;border-color:var(--border2)!important;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:0.5px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;background:none;color:var(--text);font-family:'DM Sans',sans-serif}
.chip.sel{background:var(--info-bg);border-color:var(--info-text);color:var(--info-text)}
.sport-det{background:var(--bg2);border-radius:var(--r);padding:10px;margin-top:4px;display:flex;flex-direction:column;gap:7px}
.color-row{display:flex;gap:7px}
.cdot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent}
.cdot.sel{border-color:var(--text)}

/* ─── MUSCULATION ─── */
.muscu-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.muscu-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:var(--r);padding:7px 10px}
.muscu-name{flex:1;font-size:13px}
.muscu-input{width:70px!important;text-align:center;padding:4px 6px!important}

/* ─── TODO ─── */
.todo-fixed{border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.todo-row{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:0.5px solid var(--border)}
.todo-row:last-child{border-bottom:none}
.todo-row:hover{background:var(--bg2)}
.todo-check{width:15px;height:15px;cursor:pointer;flex-shrink:0;accent-color:var(--text)}
.todo-label{font-size:13px;flex:1}
.todo-label.done{color:var(--text3);text-decoration:line-through}
.todo-time{width:60px!important;font-size:12px!important;padding:3px 5px!important}

/* ─── ADD ITEMS ─── */
.add-item{background:var(--bg2);border-radius:var(--r);padding:10px;margin-top:5px;display:flex;flex-direction:column;gap:7px}
.add-item-header{display:flex;align-items:center;justify-content:space-between}
.rm-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:0 2px;line-height:1}
.rm-btn:hover{color:var(--text)}
.add-btn{font-size:12px;color:var(--text2);background:none;border:0.5px dashed var(--border2);border-radius:var(--r);padding:5px 11px;cursor:pointer;margin-top:4px;width:100%;font-family:'DM Sans',sans-serif}
.add-btn:hover{background:var(--bg2)}

/* ─── PROJET ─── */
.project-card{border:0.5px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:8px;position:relative}
.project-card.active-proj{border-color:var(--ok)}
.project-card.closed-proj{opacity:.65}
.proj-title{font-size:14px;font-weight:500;margin-bottom:4px}
.proj-meta{font-size:12px;color:var(--text2);margin-bottom:8px}
.proj-milestone{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 0}
.proj-m-check{accent-color:var(--ok)}
.fin-btn{background:#fcebeb;border:0.5px solid #e24b4a;color:#a32d2d;border-radius:var(--r);padding:6px 14px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;margin-top:8px}
.fin-btn:hover{background:#f7c1c1}
.reopen-btn{background:var(--bg2);border:0.5px solid var(--border2);color:var(--text2);border-radius:var(--r);padding:5px 12px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif}

/* ─── SAVE ─── */
.save-btn{background:var(--text);color:var(--bg);border:none;border-radius:var(--r);padding:9px 20px;font-size:13px;cursor:pointer;font-weight:500;margin-top:4px;font-family:'DM Sans',sans-serif}
.save-btn:hover{opacity:.85}
.save-msg{font-size:12px;color:var(--ok);margin-top:5px;display:none}

/* ─── STATS ─── */
.stat-tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.st{border:0.5px solid var(--border);border-radius:var(--r);padding:5px 13px;font-size:13px;cursor:pointer;background:none;color:var(--text2);font-family:'DM Sans',sans-serif}
.st.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.sc{background:var(--bg2);border-radius:var(--r);padding:11px 13px}
.sc-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.sc-val{font-size:22px;font-weight:500;line-height:1.1}
.sc-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sc.hl{background:#eaf3de;border:0.5px solid #97c459}
.sc.hl .sc-val,.sc.hl .sc-label{color:#27500a}.sc.hl .sc-sub{color:#639922}
.sc.gold{background:#faeeda;border:0.5px solid #fac775}
.sc.gold .sc-val,.sc.gold .sc-label{color:#633806}.sc.gold .sc-sub{color:#854f0b}
.stitle{font-size:13px;font-weight:500;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.stitle-badge{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg3);color:var(--text2);font-weight:400}
.warn-box{border:0.5px solid var(--warn-border);background:var(--warn-bg);border-radius:var(--r);padding:9px 13px;font-size:13px;color:var(--warn-text);margin-bottom:7px}
.corr-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:12px}
.corr-row:last-child{border-bottom:none}
.cbar-w{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.cbar{height:100%;border-radius:3px}
.book-item{background:var(--bg2);border-radius:var(--r);padding:9px 12px;margin-bottom:5px}
.book-title{font-size:13px;font-weight:500}
.book-meta{font-size:12px;color:var(--text2)}
.book-badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;margin-top:3px}
.badge-loisir{background:#eeedfe;color:#3c3489}
.badge-capes{background:#fbeaf0;color:#72243e}
.badge-hist-rom{background:#faeeda;color:#633806}
.badge-hist-pap{background:#e6f1fb;color:#0c447c}
.badge-hist-col{background:#fcebeb;color:#791f1f}
.badge-geo-pac{background:#e1f5ee;color:#085041}
.badge-geo-lit{background:#eeedfe;color:#26215c}
.badge-geo-env{background:#eaf3de;color:#27500a}

/* ─── STREAK ─── */
.streak-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.streak-row:last-child{border-bottom:none}
.streak-fire{font-size:16px}
.streak-val{font-size:20px;font-weight:500;color:#ba7517;min-width:40px}
.streak-lbl{flex:1;color:var(--text2)}
.streak-max{font-size:11px;color:var(--text3)}

/* ─── BILAN SPORT ─── */
.hero-sport{background:var(--bg2);border-radius:var(--rl);padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-num{font-family:'DM Serif Display',serif;font-size:36px;color:#27500a;line-height:1}
.hero-label{font-size:11px;color:#3b6d11;font-weight:500;margin-bottom:3px}
.hero-eq{font-size:12px;color:var(--text2);margin-top:4px}
.progress-bar{height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:4px}
.sport-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.sport-bar-name{min-width:95px;color:var(--text2);text-transform:capitalize}
.sport-bar-wrap{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.sport-bar-fill{height:100%;border-radius:4px}
.sport-bar-val{min-width:50px;text-align:right;font-weight:500;font-size:12px}
.xp-card{border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:7px}
.xp-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;flex-wrap:wrap;gap:3px}
.xp-title{font-size:13px;font-weight:500}
.xp-badge{font-size:11px;padding:2px 8px;border-radius:20px}
.xp-footer{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
.cal-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:12px;flex-wrap:wrap}
.cal-row:last-child{border-bottom:none}
.legend-row{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text2);margin-bottom:7px}

let dropboxAccessToken=localStorage.getItem('bj_dropbox_access_token')||null;
let dropboxTokenExpiresAt=+(localStorage.getItem('bj_dropbox_expires_at')||0);

/* ════════════════════════════════════════════════
   DROPBOX (identique v6)
   ════════════════════════════════════════════════ */
function currentRedirectUri(){return location.origin+location.pathname;}
function updateDropboxButton(txt,connected=false){const b=document.getElementById('dropbox-btn');if(!b)return;b.textContent=txt;b.classList.toggle('connected',connected);}
function dropboxTokenValid(){return !!dropboxAccessToken&&Date.now()<dropboxTokenExpiresAt-60000;}
function base64Url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function randomString(len=64){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';const arr=new Uint8Array(len);crypto.getRandomValues(arr);return Array.from(arr,b=>chars[b%chars.length]).join('');}
async function sha256(txt){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));}
async function connectDropbox(){
  if(DROPBOX_APP_KEY.startsWith('REMPLACE_MOI')){alert('Crée une app Dropbox et remplace DROPBOX_APP_KEY.');updateDropboxButton('Config requise');return;}
  const verifier=randomString(96);const challenge=base64Url(await sha256(verifier));
  sessionStorage.setItem('bj_dropbox_code_verifier',verifier);
  const url=new URL('https://www.dropbox.com/oauth2/authorize');
  url.searchParams.set('client_id',DROPBOX_APP_KEY);url.searchParams.set('response_type','code');
  url.searchParams.set('code_challenge',challenge);url.searchParams.set('code_challenge_method','S256');
  url.searchParams.set('token_access_type','online');url.searchParams.set('scope',DROPBOX_SCOPES);
  url.searchParams.set('redirect_uri',currentRedirectUri());location.href=url.toString();
}
async function finishDropboxAuthIfNeeded(){
  const params=new URLSearchParams(location.search);const code=params.get('code');
  if(!code){updateDropboxButton(dropboxTokenValid()?'Dropbox connecté':'Connecter Dropbox',dropboxTokenValid());return;}
  const verifier=sessionStorage.getItem('bj_dropbox_code_verifier');
  history.replaceState({},document.title,currentRedirectUri());
  if(!verifier){updateDropboxButton('Dropbox à reconnecter');return;}
  try{
    updateDropboxButton('Connexion…');
    const body=new URLSearchParams({code,grant_type:'authorization_code',client_id:DROPBOX_APP_KEY,code_verifier:verifier,redirect_uri:currentRedirectUri()});
    const res=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    if(!res.ok)throw new Error(await res.text());
    const tok=await res.json();
    dropboxAccessToken=tok.access_token;dropboxTokenExpiresAt=Date.now()+((tok.expires_in||14400)*1000);
    localStorage.setItem('bj_dropbox_access_token',dropboxAccessToken);localStorage.setItem('bj_dropbox_expires_at',String(dropboxTokenExpiresAt));
    sessionStorage.removeItem('bj_dropbox_code_verifier');updateDropboxButton('Dropbox connecté',true);await syncFromDropbox();
  }catch(e){console.error(e);updateDropboxButton('Erreur Dropbox');}
}
async function dropboxApi(url,opts={}){
  if(!dropboxTokenValid())throw new Error('Token invalide');
  const res=await fetch(url,{...opts,headers:{Authorization:`Bearer ${dropboxAccessToken}`,...(opts.headers||{})}});
  if(!res.ok)throw new Error(await res.text());return res;
}
async function syncFromDropbox(){
  if(!dropboxTokenValid()){updateDropboxButton('Connecter Dropbox');return;}
  try{
    updateDropboxButton('Lecture…',true);
    const res=await dropboxApi('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Dropbox-API-Arg':JSON.stringify({path:DROPBOX_FILE_PATH})}});
    const remote=JSON.parse(await res.text());
    if(remote&&typeof remote==='object'){
      /* Résolution de conflits par timestamp */
      const remoteTs=remote.__savedAt?new Date(remote.__savedAt):new Date(0);
      const localTs=DATA.__savedAt?new Date(DATA.__savedAt):new Date(0);
      if(remoteTs>localTs){
        /* Remote plus récent — fusion entry par entry */
        const merged={...DATA};
        Object.entries(remote).forEach(([k,v])=>{
          if(k.match(/^\d{4}-\d{2}-\d{2}$/)&&v){
            const rd=v.__ts?new Date(v.__ts):remoteTs;
            const ld=(DATA[k]&&DATA[k].__ts)?new Date(DATA[k].__ts):localTs;
            if(!DATA[k]||rd>=ld)merged[k]=v;
          } else if(k.startsWith('__')){merged[k]=v;}
        });
        DATA=merged;
        localStorage.setItem('bj_v7',JSON.stringify(DATA));
        renderCal();renderStats();updateDropboxButton('Synchronisé ✓',true);
      } else {
        updateDropboxButton('Dropbox connecté',true);
      }
    }
  }catch(e){const msg=String(e.message||e);if(msg.includes('path/not_found')){await uploadDropboxFile();updateDropboxButton('Dropbox connecté',true);return;}console.error(e);updateDropboxButton('Erreur lecture',false);}
}
async function uploadDropboxFile(){
  if(!dropboxTokenValid())return;
  try{
    updateDropboxButton('Sauvegarde…',true);
    await dropboxApi('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path:DROPBOX_FILE_PATH,mode:'overwrite',autorename:false,mute:true})},body:JSON.stringify(DATA,null,2)});
    updateDropboxButton('Sauvegardé',true);
  }catch(e){console.error(e);updateDropboxButton('Erreur save',false);}
}
function scheduleDropboxSave(){if(!dropboxTokenValid())return;clearTimeout(dropboxSaveTimer);dropboxSaveTimer=setTimeout(uploadDropboxFile,900);}

/* ════════════════════════════════════════════════
   UTILITAIRES
   ════════════════════════════════════════════════ */
function dk(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function parseDateKey(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function moodCol(m){return MOOD_COLORS[m]||'#888780'}
function initDay(k){DATA[k]=DATA[k]||{sport:[],sportData:{},books:[],socialMeetings:[],fixedTodos:{},travailTodos:{},muscu:{},ecriture:{roman:{},poesie:{}}};return DATA[k]}
function sleepDur(s,e){if(!s||!e)return '—';const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);let m=(eh*60+em)-(sh*60+sm);if(m<0)m+=1440;return `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;}
function bmiForWeight(w){return w&&USER_HEIGHT_M?(+w/(USER_HEIGHT_M*USER_HEIGHT_M)).toFixed(1):null;}
function bmiLabel(b){if(!b)return '';b=+b;if(b<18.5)return 'maigreur';if(b<25)return 'normal';if(b<30)return 'surpoids';return 'obésité';}
function parseSportNumber(v){if(v===undefined||v===null)return 0;const n=parseFloat(String(v).replace(',','.').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0;}
function cocaMl(d){return d.cocaMl||0;}
function mealCalories(d){return d.mealKcal||(d.meal?MEAL_KCAL_DEFAULTS[d.meal]||0:0);}

  return s;
}

  initDay(k).quality=v;

function qualityLabel(n){return ['','Difficile','Ordinaire','Correct','Bonne journée','Excellente'][n||0]||'';}

/* ── Streak avec date record ── */
function calcStreak(fn){
  const keys=Object.keys(DATA).filter(k=>k.match(/^\d{4}-\d{2}-\d{2}$/)).sort();
  let cur=0,max=0,maxEndDate='',prev=null;
  keys.forEach(k=>{
    if(k.startsWith('__'))return;
    const d=DATA[k];if(!d)return;
    const dt=parseDateKey(k);
    if(prev){const diff=Math.round((dt-prev)/86400000);if(diff===1&&fn(d)){cur++;}else{cur=fn(d)?1:0;}}
    else{cur=fn(d)?1:0;}
    prev=dt;
    if(cur>max){max=cur;maxEndDate=k;}
  });
  return{cur,max,maxEndDate};
}

function qeSetMood(m,btn){qeMood=m;btn.closest('.quick-mood-row').querySelectorAll('.qmb').forEach(b=>b.className='qmb');btn.className=`qmb sel-${m}`;}
function qeSetMed(s,btn){qeMedStatus=s;btn.closest('div').querySelectorAll('.qmb').forEach(b=>b.className='qmb');btn.className='qmb sel-ok';}
function renderQeQuality(n){
  const row=document.getElementById('qe-quality-row');
  row.innerHTML='';
  for(let i=1;i<=5;i++){
    const span=document.createElement('span');
    span.textContent=i<=n?'★':'☆';
    span.style.cursor='pointer';
    span.style.color=i<=n?'#ba7517':'var(--border2)';
    span.onclick=(()=>{const v=i;return ()=>{qeQuality=v;renderQeQuality(v);}})();
    row.appendChild(span);
  }

function saveQuickEntry(){
  const todayKey=dk(now.getFullYear(),now.getMonth(),now.getDate());
  const day=initDay(todayKey);

function runSearch(q){

   ════════════════════════════════════════════════ */
function renderCapesRadar(allFiches,allCapesBooks,allCapesArticles,targetFiches){
  const themes=['Histoire Romaine','Histoire Christianisme','Histoire Coloniale','Géographie Pacifique','Géographie Environnement','Géographie Littoral'];
  const counts={};themes.forEach(t=>{counts[t]={fiches:0,livres:0,articles:0,travailMin:0};});
  allFiches.forEach(f=>{if(counts[f.label])counts[f.label].fiches++;});
  allCapesBooks.forEach(b=>{if(counts[b.label])counts[b.label].livres++;});
  allCapesArticles.forEach(a=>{if(counts[a.label])counts[a.label].articles++;});
  const maxFiches=Math.max(1,...Object.values(counts).map(c=>c.fiches));
  let html='<div class="radar-wrap">';
  themes.forEach(t=>{
    const c=counts[t];const pct=Math.round(c.fiches/maxFiches*100);
    const color=pct>=75?'#1d9e75':pct>=50?'#639922':pct>=25?'#f0c040':'#e24b4a';
    html+=`<div class="radar-theme">
      <div class="radar-theme-label">${t}</div>
      <div class="radar-bar-row">
        <div style="flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden">
          <div class="radar-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        <span style="min-width:24px;text-align:right;font-weight:500">${c.fiches}</span>
      </div>
      <div style="font-size:11px;color:var(--text2)">${c.livres} livre${c.livres!==1?'s':''} · ${c.articles} article${c.articles!==1?'s':''}</div>
    </div>`;
  });
  html+='</div>';
  /* progression vers objectif */
  const totalFiches=allFiches.length;
  const obj=targetFiches||100;
  const pctObj=Math.min(100,Math.round(totalFiches/obj*100));
  const remaining=Math.max(0,obj-totalFiches);
  html+=`<div class="add-item" style="margin-top:8px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div style="font-size:13px;font-weight:500">Objectif fiches CAPES</div>

    <div style="font-size:12px;color:var(--text2)">${remaining} fiche${remaining!==1?'s':''} restante${remaining!==1?'s':''} · à ce rythme : voir les stats</div>
  </div>`;
  return html;
}

/* ════════════════════════════════════════════════
   PEARSON CORRELATION (réelle, sur les données)
   ════════════════════════════════════════════════ */
function pearson(xs,ys){
  const pairs=xs.map((x,i)=>[x,ys[i]]).filter(([a,b])=>a!==null&&b!==null&&a!==undefined&&b!==undefined);
  if(pairs.length<4)return null;
  const n=pairs.length;
  const mx=pairs.reduce((a,[x])=>a+x,0)/n,my=pairs.reduce((a,[,y])=>a+y,0)/n;
  let num=0,dx2=0,dy2=0;
  pairs.forEach(([x,y])=>{const a=x-mx,b=y-my;num+=a*b;dx2+=a*a;dy2+=b*b;});
  const denom=Math.sqrt(dx2*dy2);
  return denom<1e-10?null:Math.round(num/denom*100)/100;
}

    if(day.fiches||day.capesNote||(day.capesFichesList&&day.capesFichesList.length))dots+=`<div class="dot" style="background:#d4537e"></div>`;
    if(day.medStatus==='oublie'||day.medStatus==='oublié')dots+=`<div class="dot" style="background:#e24b4a;border:1px solid #a32d2d" title="Teralite oublié"></div>`;
    else if(day.medStatus==='decale'||day.medStatus==='décalé')dots+=`<div class="dot" style="background:#ba7517" title="Teralite décalé"></div>`;

function calcMedDrift(actual,ideal){
  if(!actual||!ideal)return '—';
  const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
  let diff=toMin(actual)-toMin(ideal);
  if(diff>720)diff-=1440;if(diff<-720)diff+=1440;
  const abs=Math.abs(diff);
  const h=Math.floor(abs/60),m=abs%60;
  const sign=diff>0?'+':diff<0?'-':'';
  const col=abs<=15?'#1d9e75':abs<=30?'#639922':abs<=60?'#ba7517':'#e24b4a';
  return `<span style="color:${col}">${sign}${h>0?h+'h':''}${m>0?m+'min':'0min'}</span>`;
}
function updMedTime(k,input){
  initDay(k).medTime=input.value;
  updMedTimeDrift(k);
}
function updMedTimeDrift(k){
  const day=DATA[k]||{};
  const driftEl=document.getElementById('med-drift-'+k);
  if(driftEl) driftEl.innerHTML=calcMedDrift(day.medTime,day.medIdealTime||DATA.__teraliteIdealTime||'22:00');
}

function addRecherche(k,type){
  const day=initDay(k);day.ecriture=day.ecriture||{roman:{},poesie:{},recherche:{roman:[],poesie:[]}};

  day.ecriture.recherche[type].push({title:'',author:'',genre:'',status:'en cours',intent:'',note:''});

function removeRecherche(k,type,i){
  const day=initDay(k);
  if(day.ecriture?.recherche?.[type])day.ecriture.recherche[type].splice(i,1);

}
function updRecherche(k,input){
  const day=initDay(k);day.ecriture=day.ecriture||{roman:{},poesie:{},recherche:{roman:[],poesie:[]}};
  day.ecriture.recherche=day.ecriture.recherche||{roman:[],poesie:[]};
  const i=+input.dataset.ri,type=input.dataset.rtype,f=input.dataset.rf;
  day.ecriture.recherche[type]=day.ecriture.recherche[type]||[];

  day.ecriture.recherche[type][i][f]=input.tagName==='SELECT'?input.options[input.selectedIndex].value:input.value;

function switchEcritureTab(k,tab,btn){

function keepCapesOpen(k){
  rebuildSheet(k);
  openSectionByTitle('CAPES');
}

function openSectionByTitle(title){
  document.querySelectorAll('.section').forEach(sec=>{
    const t=sec.querySelector('.sec-title');
    const body=sec.querySelector('.sec-body');
    const arrow=sec.querySelector('.sec-arrow');
    if(t && t.textContent.trim()===title && body){
      body.classList.add('open');
      if(arrow)arrow.style.transform='rotate(180deg)';
    }
  });
}

function addCapesFiche(k){
  const day=initDay(k);
  day.capesFichesList=day.capesFichesList||[];
  day.capesFichesList.push({title:'',label:'',note:'',createdAt:k,locked:false});
  saveData();
  keepCapesOpen(k);
}

function removeCapesFiche(k,i){
  initDay(k).capesFichesList.splice(i,1);
  saveData();
  keepCapesOpen(k);
}

function toggleCapesFicheLock(k,i){
  const day=initDay(k);
  day.capesFichesList=day.capesFichesList||[];
  day.capesFichesList[i]=day.capesFichesList[i]||{};
  day.capesFichesList[i].locked=!day.capesFichesList[i].locked;
  saveData();
  keepCapesOpen(k);
}

function updCapesFiche(k,input){
  const day=initDay(k);
  const i=+input.dataset.fi;
  const f=input.dataset.ff;
  day.capesFichesList=day.capesFichesList||[];
  day.capesFichesList[i]=day.capesFichesList[i]||{};
  if(day.capesFichesList[i].locked)return;
  day.capesFichesList[i][f]=input.tagName==='SELECT'
    ? input.options[input.selectedIndex].value
    : input.value;
}

function getObjectives(){return DATA.__objectives||[];}
function setObjectives(arr){DATA.__objectives=arr;saveData();}

const OBJ_TYPES=[
  {key:'poids',label:'Poids cible',unit:'kg',icon:'⚖️',tracker:d=>d.weight||null,dir:-1},
  {key:'fiches',label:'Fiches CAPES',unit:'fiches',icon:'📝',tracker:d=>null,dir:1},
  {key:'livres_capes',label:'Livres CAPES',unit:'livres',icon:'📚',tracker:d=>null,dir:1},
  {key:'articles_capes',label:'Articles CAPES',unit:'articles',icon:'📰',tracker:d=>null,dir:1},
  {key:'roman_mots',label:'Mots roman',unit:'mots',icon:'✍️',tracker:d=>(d.ecriture?.roman?.mots||0)||null,dir:1},
  {key:'poesie_nb',label:'Nombre de poèmes',unit:'poèmes',icon:'🖊️',tracker:d=>(d.ecriture?.poesie?.poemes||0)||null,dir:1},
];

function getCumulativeValue(key){
  const allEntries=Object.entries(DATA).filter(([k])=>k.match(/^\d{4}-\d{2}-\d{2}$/)).sort(([a],[b])=>a.localeCompare(b));
  if(key==='poids'){const last=allEntries.filter(([,d])=>d.weight).pop();return last?last[1].weight:null;}
  if(key==='roman_mots'){return allEntries.reduce((a,[,d])=>a+(d.ecriture?.roman?.mots||0),0);}
  if(key==='poesie_nb'){return allEntries.reduce((a,[,d])=>a+(d.ecriture?.poesie?.poemes||0),0);}
  if(key==='fiches'){return allEntries.reduce((a,[,d])=>a+(d.capesFichesList?.length||0),0);}
  if(key==='livres_capes'){const seen=new Set();allEntries.forEach(([,d])=>(d.capesBooksList||[]).forEach(b=>{if(b.title)seen.add(b.title);}));return seen.size;}
  if(key==='articles_capes'){const seen=new Set();allEntries.forEach(([,d])=>(d.capesArticlesList||[]).forEach(a=>{if(a.title)seen.add(a.title);}));return seen.size;}
  return null;
}

function renderProjets(){
  const projects=getProjects();
  const objectives=getObjectives();
  const active=projects.filter(p=>!p.closed);
  const closed=projects.filter(p=>p.closed);
  const el=document.getElementById('projets-content');

  /* ── Section objectifs ── */
  let objHtml=`<div class="stitle">Objectifs <span class="stitle-badge">${objectives.length} définis</span></div>`;
  objHtml+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">`;
  OBJ_TYPES.forEach(ot=>{
    const existing=objectives.find(o=>o.key===ot.key);
    if(!existing){
      objHtml+=`<button onclick="addObjective('${ot.key}')" style="font-size:12px;padding:5px 11px;border:0.5px dashed var(--border2);border-radius:var(--r);background:none;cursor:pointer;color:var(--text2);font-family:'DM Sans',sans-serif">${ot.icon} ${ot.label}</button>`;
    }
  });
  objHtml+=`</div>`;

  objectives.forEach((obj,oi)=>{
    const ot=OBJ_TYPES.find(t=>t.key===obj.key)||{label:obj.key,unit:'',icon:'🎯',dir:1};
    const cur=getCumulativeValue(obj.key);
    const target=obj.target;
    const pct=target&&cur!==null?Math.min(100,Math.round((ot.dir>0?cur/target:((target*2-cur)/target))*100)):null;
    const daysLeft=obj.deadline?Math.round((new Date(obj.deadline)-now)/86400000):null;

function addObjective(key){
  const objectives=getObjectives();
  if(objectives.find(o=>o.key===key))return;
  objectives.push({key,target:null,deadline:'',note:''});
  setObjectives(objectives);renderProjets();
}
function removeObjective(i){
  const objectives=getObjectives();objectives.splice(i,1);setObjectives(objectives);renderProjets();
}
function updateObjective(i,field,val){
  const objectives=getObjectives();objectives[i]=objectives[i]||{};objectives[i][field]=val;setObjectives(objectives);
}

function renderProjectCard(p,idx,isClosed){
  const start=p.startDate?new Date(p.startDate):null;
  const end=p.endDate?new Date(p.endDate):null;
  const daysActive=start?(Math.round(((end||now)-start)/86400000))+'j':'?';
  const milestones=(p.milestones||[]).map((m,mi)=>`
    <div class="proj-milestone">
      <input type="checkbox" class="proj-m-check" ${m.done?'checked':''} onchange="toggleMilestone(${idx},${mi},this)">
      <span style="${m.done?'text-decoration:line-through;color:var(--text3)':''}">${m.label}</span>
      ${m.date?`<span style="font-size:11px;color:var(--text3)">${m.date}</span>`:''}
    </div>`).join('');
  const doneCount=(p.milestones||[]).filter(m=>m.done).length;
  const totalM=(p.milestones||[]).length;
  return `<div class="project-card ${isClosed?'closed-proj':'active-proj'}">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div style="flex:1">
        <div class="proj-title">${p.name||'Projet sans nom'}</div>
        <div class="proj-meta">Début : ${p.startDate||'?'} ${isClosed&&p.endDate?' · Fin : '+p.endDate:''} · Durée : ${daysActive} ${totalM?' · Jalons : '+doneCount+'/'+totalM:''}</div>
      </div>
      ${isClosed?`<button class="reopen-btn" onclick="reopenProject(${idx})">Rouvrir</button>`:''}
    </div>
    ${milestones?`<div style="margin:6px 0">${milestones}</div>`:''}
    <div class="fl"><div class="lbl">Note</div><textarea placeholder="Notes sur ce projet..." oninput="updateProjectNote(${idx},this.value)" style="min-height:48px">${p.note||''}</textarea></div>

function addProject(){
  const name=prompt('Nom du projet :');if(!name)return;
  const startDate=prompt('Date de début (AAAA-MM-JJ) :',dk(now.getFullYear(),now.getMonth(),now.getDate()));
  const projects=getProjects();
  projects.push({name,startDate:startDate||dk(now.getFullYear(),now.getMonth(),now.getDate()),milestones:[],note:'',closed:false});
  setProjects(projects);renderProjets();
}
function addMilestone(idx){
  const label=prompt('Jalon :');if(!label)return;
  const date=prompt('Date cible (facultatif) :','');
  const projects=getProjects();
  projects[idx].milestones=projects[idx].milestones||[];

function closeProject(idx){

function sleepHoursForStats(d){
  if(!d.sleepStart||!d.sleepEnd)return null;
  const[sh,sm]=d.sleepStart.split(':').map(Number),[eh,em]=d.sleepEnd.split(':').map(Number);
  if(!Number.isFinite(sh)||!Number.isFinite(eh))return null;
  let m=(eh*60+em)-(sh*60+sm);
  if(m<0)m+=1440;
  return Math.round((m/60)*10)/10;
}
function medHourForStats(d){
  if(!d.medTime)return null;
  const[h,m]=d.medTime.split(':').map(Number);
  if(!Number.isFinite(h))return null;
  return Math.round((h+(m||0)/60)*10)/10;
}
function sportMinutesForStats(d){
  if(!d||!d.sportData)return 0;
  return Object.values(d.sportData).reduce((a,sd)=>a+parseSportNumber(sd['durée (min)']||sd['duree (min)']),0);
}
function moodScoreForStats(m){return {vl:1,l:2,n:3,g:4,vg:5,h:6}[m]||null;}
function getHealthEntries(){
  const entries=Object.entries(DATA).filter(([k])=>k.match(/^\d{4}-\d{2}-\d{2}$/)).sort(([a],[b])=>a.localeCompare(b));
  if(healthRangeDays==='all')return entries;
  const days=+healthRangeDays||30;
  const today=new Date();today.setHours(0,0,0,0);
  const from=new Date(today);from.setDate(from.getDate()-days+1);
  return entries.filter(([k])=>{const dt=parseDateKey(k);return dt>=from&&dt<=today;});
}
function toggleHealthSeries(key,cb){
  healthVisible[key]=cb.checked;
  renderHealthChart();
}
function setHealthRange(v){

}
function renderHealthChart(){
  const canvas=document.getElementById('health-chart');
  if(!canvas)return;
  const entries=getHealthEntries();
  const labels=entries.map(([k])=>k.slice(5));

  const datasets=[
    {key:'sleep',label:'Sommeil (h)',data:days.map(sleepHoursForStats),yAxisID:'yHours',borderWidth:2,tension:.25,spanGaps:true},

function filterEntries(period){
  const today=new Date();today.setHours(0,0,0,0);
  const entries=Object.entries(DATA).filter(([k])=>k.match(/^\d{4}-\d{2}-\d{2}$/)).sort(([a],[b])=>a.localeCompare(b));
  if(period==='all')return{entries,label:'Tout le journal'};
  let from=new Date(today);
  if(period==='week'){from.setDate(from.getDate()-6);}
  else if(period==='month'){from=new Date(today.getFullYear(),today.getMonth(),1);}
  else if(period==='year'){from=new Date(today.getFullYear(),0,1);}
  const filtered=entries.filter(([k])=>{const d=parseDateKey(k);return d>=from&&d<=today;});
  const label=period==='week'?'7 derniers jours':period==='month'?'Ce mois-ci':period==='year'?'Cette année':'Tout';
  return{entries:filtered,label};
}

/* ════════════════════════════════════════════════
   BILAN SPORT (repris de v6 avec extraction depuis DATA)
   ════════════════════════════════════════════════ */
function extractSportEntries(year,month){
  const out=[];
  Object.entries(DATA).forEach(([key,day])=>{
    const m=key.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m||+m[1]!==year||(+m[2]-1)!==month||!day||!Array.isArray(day.sport))return;
    const dayNum=+m[3];
    day.sport.forEach(sport=>{
      const sd=(day.sportData&&day.sportData[sport])||{};
      const min=parseSportNumber(sd['durée (min)']||sd['duree (min)']);
      const dist=parseSportNumber(sd['distance (km)']||sd['distance (m)']);
      out.push({day:dayNum,date:key,sport,min,dist});
    });
  });
  return out.sort((a,b)=>a.day-b.day);
}

function renderBilanSport(){
  const targetYear=curYear,targetMonth=curMonth;
  const isCurrentMonth=targetYear===now.getFullYear()&&targetMonth===now.getMonth();
  const today=isCurrentMonth?now.getDate():new Date(targetYear,targetMonth+1,0).getDate();
  const daysInMonth=new Date(targetYear,targetMonth+1,0).getDate();
  const SPORT_ENTRIES=extractSportEntries(targetYear,targetMonth);
  const bySport={},byDay={};
  SPORT_ENTRIES.forEach(s=>{
    if(!bySport[s.sport])bySport[s.sport]={min:0,kcal:0,sessions:0};
    bySport[s.sport].min+=s.min;bySport[s.sport].kcal+=Math.round(s.min*(SPORT_KCAL_MIN[s.sport]||5));bySport[s.sport].sessions++;
    byDay[s.day]=byDay[s.day]||[];byDay[s.day].push(s);
  });
  const totalMin=Object.values(bySport).reduce((a,v)=>a+v.min,0);
  const totalKcal=Object.values(bySport).reduce((a,v)=>a+v.kcal,0);
  const totalSessions=SPORT_ENTRIES.length;
  const activeDays=[...new Set(SPORT_ENTRIES.map(s=>s.day))].length;
  const avgKcalDay=today?Math.round(totalKcal/today):0;
  const projectedKcal=Math.round(avgKcalDay*daysInMonth);
  const pct=Math.min(100,Math.round(totalKcal/OBJ_KCAL_MONTH*100));
  if(!SPORT_ENTRIES.length){document.getElementById('sport-bilan').innerHTML=`<div class="warn-box">Aucune entrée sport pour ${MONTHS[targetMonth]} ${targetYear}. Renseigne la durée dans les fiches quotidiennes.</div>`;return;}
  const maxMin=Math.max(1,...Object.values(bySport).map(v=>v.min));
  const sportBarsHtml=Object.entries(bySport).sort((a,b)=>b[1].min-a[1].min).map(([sport,d])=>{const h=Math.floor(d.min/60),m=d.min%60;return `<div class="sport-bar-row"><span class="sport-bar-name">${sport}</span><div class="sport-bar-wrap"><div class="sport-bar-fill" style="width:${Math.round(d.min/maxMin*100)}%;background:${SPORT_COLORS[sport]||'#888'}"></div></div><span class="sport-bar-val" style="color:${SPORT_COLORS[sport]||'#888'}">${h>0?h+'h':''}${m>0?String(m).padStart(h>0?2:1,'0')+'min':''}</span></div>`;}).join('');
  const projs=[{title:'À ce rythme',end:projectedKcal,color:'#639922',badge:'tendance'},{title:'+1 séance/sem.',end:Math.round(projectedKcal*1.18),color:'#1D9E75',badge:'objectif'},{title:'Intensité ×1.2',end:Math.round(projectedKcal*1.2),color:'#185FA5',badge:'progression'},{title:'Mode max',end:Math.round(projectedKcal*1.35),color:'#7F77DD',badge:'max'}];
  const projHtml=projs.map(p=>{const pp=Math.min(100,Math.round(p.end/OBJ_KCAL_MONTH*100));const diff=p.end-OBJ_KCAL_MONTH;return `<div class="xp-card"><div class="xp-header"><span class="xp-title">${p.title}</span><span class="xp-badge" style="background:${p.color}22;color:${p.color}">${p.badge}</span></div><div class="progress-bar"><div class="progress-fill" style="background:${p.color};width:${pp}%"></div></div><div class="xp-footer"><span style="font-weight:500;color:${p.color}">${p.end.toLocaleString('fr-FR')} kcal</span><span style="color:${diff>=0?'#3b6d11':'#a32d2d'}">${diff>=0?'+':''}${diff.toLocaleString('fr-FR')} vs obj.</span></div></div>`;}).join('');
  function kcalEq(k){const km=Math.round(k/10);if(km>=5)return `≈ ${km} km de course`;return `≈ ${Math.round(k/270)} tranches de pain`;}
  const calDetailHtml=Object.entries(bySport).sort((a,b)=>b[1].kcal-a[1].kcal).map(([sport,d])=>`<div class="cal-row"><div style="width:9px;height:9px;border-radius:50%;background:${SPORT_COLORS[sport]||'#888'};flex-shrink:0"></div><span style="flex:1;font-weight:500;text-transform:capitalize">${sport}</span><span style="font-size:11px;color:var(--text2)">${d.sessions} séance${d.sessions>1?'s':''}</span><span style="font-weight:500;color:#27500a">${d.kcal.toLocaleString('fr-FR')} kcal</span><span style="font-size:11px;color:var(--text2);min-width:110px;text-align:right">${kcalEq(d.kcal)}</span></div>`).join('');

  document.getElementById('sport-bilan').innerHTML=`
  <div class="hero-sport">
    <div style="flex:1;min-width:150px"><div class="hero-label">Calories — ${MONTHS[targetMonth]} ${targetYear}</div><div class="hero-num">${totalKcal.toLocaleString('fr-FR')} kcal</div><div class="hero-eq">≈ ${Math.round(totalKcal/7700*10)/10} kg · ${Math.round(totalKcal/500)} repas</div></div>
    <div style="flex:1;min-width:130px"><div style="font-size:11px;color:var(--text3);margin-bottom:3px">objectif ${OBJ_KCAL_MONTH.toLocaleString('fr-FR')} kcal</div><div class="progress-bar"><div class="progress-fill" style="background:${pct>=100?'#1d9e75':'#639922'};width:${pct}%"></div></div><div style="font-size:13px;font-weight:500;color:${pct>=100?'#1d9e75':'#27500a'};margin-top:3px">${pct}%</div></div>
  </div>
  <div class="stat-grid">
    <div class="sc"><div class="sc-label">Séances</div><div class="sc-val">${totalSessions}</div></div>
    <div class="sc"><div class="sc-label">Jours actifs</div><div class="sc-val">${activeDays}</div><div class="sc-sub">sur ${today}j</div></div>
    <div class="sc"><div class="sc-label">Temps total</div><div class="sc-val">${Math.floor(totalMin/60)}h${String(totalMin%60).padStart(2,'0')}</div></div>
    <div class="sc hl"><div class="sc-label">Projection</div><div class="sc-val">${projectedKcal.toLocaleString('fr-FR')}</div><div class="sc-sub">kcal fin de mois</div></div>
  </div>
  <div class="stitle">Activité par sport</div>${sportBarsHtml}
  <div class="stitle">Volume hebdomadaire</div><div class="legend-row" id="leg-w"></div>
  <div class="chart-wrap" style="height:200px"><canvas id="chart-weekly" role="img" aria-label="Minutes de sport par semaine">Sport hebdomadaire.</canvas></div>
  <div class="stitle">Cumul mensuel + projections</div>
  <div class="legend-row"><span class="leg-item"><span class="leg-sq" style="background:#639922"></span>réel</span><span class="leg-item"><span class="leg-sq" style="background:#1D9E75"></span>tendance</span><span class="leg-item"><span class="leg-sq" style="background:#185FA5"></span>×1.2</span></div>
  <div class="chart-wrap" style="height:200px"><canvas id="chart-cumul" role="img" aria-label="Courbe cumulative calories">Calories cumulées.</canvas></div>
  <div class="stitle">Durée vs calories</div>
  <div class="chart-wrap" style="height:200px"><canvas id="chart-compare" role="img" aria-label="Durée et calories par sport">Comparaison sports.</canvas></div>
  <div class="divider"></div><div class="stitle">Extrapolations</div>${projHtml}
  <div class="divider"></div><div class="stitle">Détail calorique</div>${calDetailHtml}`;

  const legW=document.getElementById('leg-w');
  SPORTS.filter(s=>bySport[s]).forEach(s=>{legW.innerHTML+=`<span class="leg-item"><span class="leg-sq" style="background:${SPORT_COLORS[s]}"></span>${s}</span>`;});
  const weeks=[[1,7],[8,14],[15,21],[22,28],[29,31]];
  const wLabels=weeks.map((_,i)=>`S${i+1}`);
  const wDatasets=SPORTS.filter(sp=>bySport[sp]).map(sport=>({label:sport,data:weeks.map(([s,e])=>SPORT_ENTRIES.filter(d=>d.sport===sport&&d.day>=s&&d.day<=Math.min(e,today)).reduce((a,d)=>a+d.min,0)),backgroundColor:SPORT_COLORS[sport]+'cc',borderWidth:0,stack:'w'}));
  if(sportChartWeekly){sportChartWeekly.destroy();}sportChartWeekly=new Chart(document.getElementById('chart-weekly'),{type:'bar',data:{labels:wLabels,datasets:wDatasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:true,ticks:{font:{size:11}}},y:{stacked:true,ticks:{font:{size:10}},title:{display:true,text:'min',font:{size:10}}}}}});
  const days=Array.from({length:today},(_,i)=>i+1);let cumKcal=0;
  const cumulData=days.map(d=>{const dk2=(byDay[d]||[]).reduce((a,s)=>a+Math.round(s.min*(SPORT_KCAL_MIN[s.sport]||5)),0);cumKcal+=dk2;return cumKcal;});
  const slope=totalKcal/today;const allDR=Array.from({length:daysInMonth},(_,i)=>i+1);
  const projT=allDR.map(d=>d<=today?cumulData[d-1]:Math.round(totalKcal+(d-today)*slope));
  const projB=allDR.map(d=>d<=today?cumulData[d-1]:Math.round(totalKcal+(d-today)*slope*1.2));
  if(sportChartCumul){sportChartCumul.destroy();}sportChartCumul=new Chart(document.getElementById('chart-cumul'),{type:'line',data:{labels:allDR.map(d=>`${d}`),datasets:[{label:'réel',data:[...cumulData,...Array(daysInMonth-today).fill(null)],borderColor:'#639922',backgroundColor:'#eaf3de55',fill:true,tension:0.35,pointRadius:1.5,borderWidth:2.5},{label:'tendance',data:projT,borderColor:'#1D9E75',borderDash:[6,4],backgroundColor:'transparent',tension:0.35,pointRadius:0,borderWidth:1.5},{label:'×1.2',data:projB,borderColor:'#185FA5',borderDash:[3,4],backgroundColor:'transparent',tension:0.35,pointRadius:0,borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{autoSkip:true,maxTicksLimit:10,font:{size:10}}},y:{ticks:{font:{size:10},callback:v=>v.toLocaleString('fr-FR')}}}}});
  const sLabels=Object.keys(bySport);
  if(sportChartCompare){sportChartCompare.destroy();}sportChartCompare=new Chart(document.getElementById('chart-compare'),{type:'bar',data:{labels:sLabels,datasets:[{label:'durée (min)',data:sLabels.map(s=>bySport[s].min),backgroundColor:sLabels.map(s=>(SPORT_COLORS[s]||'#888')+'bb'),borderColor:sLabels.map(s=>SPORT_COLORS[s]||'#888'),borderWidth:1},{label:'cal÷5',data:sLabels.map(s=>Math.round(bySport[s].kcal/5)),backgroundColor:'#1D9E7544',borderColor:'#1D9E75',borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{if(ctx.datasetIndex===1)return `calories: ${(ctx.parsed.y*5).toLocaleString('fr-FR')} kcal`;return `durée: ${ctx.parsed.y} min`;}}}},scales:{x:{ticks:{font:{size:11},maxRotation:30}},y:{ticks:{font:{size:10}}}}}});
}

/* ════════════════════════════════════════════════
   EXPORT / IMPORT
   ════════════════════════════════════════════════ */
function exportJSON(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carnet_de_bord_v7.json';a.click();}
function importJSON(){const input=document.createElement('input');input.type='file';input.accept='application/json,.json';input.onchange=()=>{const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!imported||typeof imported!=='object'||Array.isArray(imported))throw new Error('Format invalide');if(confirm('Remplacer les données locales par ce carnet JSON ?')){DATA=imported;saveData();renderCal();renderStats();}}catch(e){alert('Impossible d\'importer ce JSON.');}};reader.readAsText(file);};input.click();}
function exportCSV(){
  const rows=[['date','humeur','énergie','sport','mots_roman','pages_roman','mots_poesie','fiches_capes','stress_travail','stress_social','sommeil_début','sommeil_fin','repas','descriptif_repas','poids','médicament','statut_med']];
  Object.entries(DATA).filter(([k])=>k.match(/^\d{4}-\d{2}-\d{2}$/)).sort(([a],[b])=>a.localeCompare(b)).forEach(([k,d])=>{
    rows.push([k,d.mood||'',d.energy||'',((d.sport||[]).join('|'))||'',d.ecriture?.roman?.mots||'',d.ecriture?.roman?.pages||'',d.ecriture?.poesie?.mots||'',d.fiches||'',d.stressTravail||'',d.stressSocial||'',d.sleepStart||'',d.sleepEnd||'',d.meal||'',d.mealDesc||'',d.weight||'',d.medName||'',d.medStatus||'']);
  });
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carnet_de_bord_v7.csv';a.click();
}

/* ════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════ */
function renderDeadlinesManager(){
  const list=getDeadlines().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  const active=list.filter(d=>!d.done);
  const done=list.filter(d=>d.done);

  document.getElementById('deadlines-content').innerHTML=`
    <div class="stitle">Ajouter une échéance</div>
    <div class="add-item">
      <div class="fl"><div class="lbl">Titre</div><input type="text" id="dl-new-label" placeholder="ex: Rendu dossier, oral blanc, contrôle..."></div>
      <div class="two">
        <div class="fl"><div class="lbl">Date</div><input type="date" id="dl-new-date"></div>
        <div class="fl"><div class="lbl">Catégorie</div>
          <select id="dl-new-category">
            <option value="CAPES">CAPES</option>
            <option value="Travail">Travail</option>
            <option value="Projet">Projet</option>
            <option value="Perso">Perso</option>
            <option value="Santé">Santé</option>
          </select>
        </div>
      </div>
      <div class="fl"><div class="lbl">Importance</div>
        <select id="dl-new-level">
          <option value="normal">Normale</option>
          <option value="important">Importante</option>
          <option value="critique">Critique</option>
        </select>
      </div>
      <div class="fl"><div class="lbl">Note</div><textarea id="dl-new-note" placeholder="Détails, choses à préparer..."></textarea></div>
      <button class="add-btn" onclick="addDeadline()">+ Ajouter l’échéance</button>
    </div>

    <div class="stitle">Échéances à venir <span class="stitle-badge">${active.length}</span></div>
    ${active.length?active.map(renderDeadlineCard).join(''):'<div style="font-size:13px;color:var(--text3)">Aucune échéance active.</div>'}

    <div class="stitle">Échéances terminées <span class="stitle-badge">${done.length}</span></div>
    ${done.length?done.map(renderDeadlineCard).join(''):'<div style="font-size:13px;color:var(--text3)">Rien de vaincu pour l’instant.</div>'}
  `;
}

function renderDeadlineCard(dl){
  const today=new Date();today.setHours(0,0,0,0);
  const dlDate=dl.date?new Date(dl.date):null;
  let diffTxt='sans date';
  if(dlDate){
    dlDate.setHours(0,0,0,0);
    const diff=Math.round((dlDate-today)/86400000);
    diffTxt=diff<0?`passée depuis ${Math.abs(diff)} j`:diff===0?'aujourd’hui':diff===1?'demain':`J-${diff}`;
  }
  const level=dl.level||'normal';
  const border=level==='critique'?'#e24b4a':level==='important'?'#ba7517':'var(--border)';
  return `<div class="project-card" style="border-color:${border}">
    <div class="proj-title">${dl.done?'✓ ':''}${dl.label||'Échéance'}</div>
    <div class="proj-meta">${dl.date||'—'} · ${diffTxt} · ${dl.category||'sans catégorie'} · ${level}</div>
    ${dl.note?`<div style="font-size:12px;color:var(--text2);margin-bottom:8px">${dl.note}</div>`:''}
    <div class="two">
      <button class="add-btn" onclick="toggleDeadlineDone('${dl.id}')">${dl.done?'Réouvrir':'Marquer finie'}</button>
      <button class="fin-btn" onclick="deleteDeadline('${dl.id}')">Supprimer</button>
    </div>
  </div>`;
}

function addDeadline(){
  const label=document.getElementById('dl-new-label').value.trim();
  const date=document.getElementById('dl-new-date').value;
  const category=document.getElementById('dl-new-category').value;
  const level=document.getElementById('dl-new-level').value;
  const note=document.getElementById('dl-new-note').value.trim();

  if(!label || !date){
    alert('Il faut au moins un titre et une date.');
    return;
  }

  const arr=getDeadlines();
  arr.push({
    id:'dl_'+Date.now(),
    label,
    date,
    category,
    level,
    note,
    done:false,
    createdAt:new Date().toISOString()
  });

  setDeadlines(arr);
  renderDeadlinesManager();
  renderDeadlinesBanner();
  renderCal();
}

function toggleDeadlineDone(id){
  const arr=getDeadlines();
  const dl=arr.find(d=>d.id===id);
  if(dl)dl.done=!dl.done;
  setDeadlines(arr);
  renderDeadlinesManager();
  renderDeadlinesBanner();
  renderCal();
}

function deleteDeadline(id){
  if(!confirm('Supprimer cette échéance ?'))return;
  setDeadlines(getDeadlines().filter(d=>d.id!==id));
  renderDeadlinesManager();
  renderDeadlinesBanner();
  renderCal();
}

document.getElementById('header-date').textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

renderCal();
renderStats('week');
renderDeadlinesBanner();

finishDropboxAuthIfNeeded().then(()=>{
  if(dropboxTokenValid()){
    syncFromDropbox();
  }
});

setInterval(()=>{
  if(dropboxTokenValid()){
    syncFromDropbox();
  }
}, 60000);
</script>
