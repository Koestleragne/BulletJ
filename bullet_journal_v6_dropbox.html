<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de bord</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fafaf8">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fafaf8;--bg2:#f2f1ed;--bg3:#e8e7e2;
  --text:#18181a;--text2:#6b6b67;--text3:#9b9b96;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.22);
  --r:8px;--rl:12px;
  --info-bg:#e6f1fb;--info-text:#185fa5;--info-border:#b5d4f4;
  --warn-bg:#faeeda;--warn-text:#854f0b;--warn-border:#fac775;
  --ok:#1d9e75;--danger:#e24b4a;
  --sport-marche:#378ADD;--sport-escalade:#D85A30;--sport-natation:#1D9E75;
  --sport-course:#E24B4A;--sport-renforcement:#7F77DD;--sport-velo:#BA7517;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#16161a;--bg2:#1e1e24;--bg3:#26262e;
  --text:#f0eff0;--text2:#9b9b96;--text3:#6b6b67;
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.22);
  --info-bg:#0c3a6b;--info-text:#85b7eb;--info-border:#185fa5;
  --warn-bg:#4a2d08;--warn-text:#fac775;--warn-border:#854f0b;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:740px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:80px}

/* ─── HEADER ─── */
.app-header{padding:18px 20px 0;display:flex;align-items:baseline;justify-content:space-between;border-bottom:0.5px solid var(--border);padding-bottom:14px}
.app-title{font-family:'DM Serif Display',serif;font-size:22px;letter-spacing:-0.3px}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.app-date{font-size:12px;color:var(--text2)}
.drive-btn{border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);padding:6px 10px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.drive-btn:hover{background:var(--bg2)}
.drive-btn.connected{background:var(--info-bg);border-color:var(--info-border);color:var(--info-text)}

/* ─── TABS ─── */
.tabs{display:flex;border-bottom:0.5px solid var(--border);padding:0 20px}
.tab{padding:11px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif}
.tab.active{color:var(--text);border-bottom:2px solid var(--text);font-weight:500}
.panel{display:none;padding:16px 20px}.panel.active{display:block}

/* ─── CALENDAR ─── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{background:none;border:0.5px solid var(--border2);border-radius:var(--r);padding:7px 14px;cursor:pointer;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif}
.cal-nav-btn:hover{background:var(--bg2)}
.month-label{font-family:'DM Serif Display',serif;font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-header{text-align:center;font-size:11px;color:var(--text2);padding:5px 0;font-weight:500}
.cal-day{border:0.5px solid var(--border);border-radius:var(--r);padding:6px;min-height:68px;cursor:pointer;background:var(--bg);transition:border-color .15s}
.cal-day:hover{border-color:var(--border2)}
.cal-day.empty{background:none;border-color:transparent;cursor:default}
.cal-day.today{border-color:var(--info-border);background:var(--info-bg)}
.cal-day.selected{border-color:var(--text);border-width:1.5px}
.day-num{font-size:11px;font-weight:500;margin-bottom:3px}
.day-dots{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:3px}
.dot{width:5px;height:5px;border-radius:50%}
.stars{font-size:9px;letter-spacing:-1px}
.star-on{color:#ba7517}.star-off{color:var(--border2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:4px}

/* ─── SHEET ─── */
.back-btn{background:none;border:0.5px solid var(--border);border-radius:var(--r);padding:7px 14px;font-size:13px;cursor:pointer;color:var(--text2);margin-bottom:14px;font-family:'DM Sans',sans-serif}
.back-btn:hover{background:var(--bg2)}
.sheet-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sheet-date{font-family:'DM Serif Display',serif;font-size:20px}
.sheet-stars{font-size:18px}

/* ─── SECTIONS ─── */
.section{border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:var(--bg2);user-select:none}
.sec-head:hover{background:var(--bg3)}
.sec-title{font-size:13px;font-weight:500}
.sec-arrow{font-size:11px;color:var(--text3);transition:transform .2s}
.sec-body{padding:13px 14px;display:none;flex-direction:column;gap:10px;border-top:0.5px solid var(--border)}
.sec-body.open{display:flex}

/* ─── FORM ELEMENTS ─── */
.fl{display:flex;flex-direction:column;gap:4px}
.lbl{font-size:12px;color:var(--text2)}
input[type=text],input[type=number],input[type=time],textarea,select{
  width:100%;font-size:13px;padding:7px 10px;
  border:0.5px solid var(--border);border-radius:var(--r);
  background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--border2)}
textarea{resize:vertical;min-height:60px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ─── MOOD / CHIP BUTTONS ─── */
.mood-btns{display:flex;gap:5px;flex-wrap:wrap}
.mb{border:0.5px solid var(--border);border-radius:var(--r);padding:5px 10px;font-size:12px;cursor:pointer;background:none;color:var(--text);font-family:'DM Sans',sans-serif}
.mb:hover{background:var(--bg2)}
.sel-vl{background:#fcebeb!important;border-color:#e24b4a!important;color:#a32d2d!important}
.sel-l{background:#fcebeb!important;border-color:#f09595!important;color:#791f1f!important}
.sel-n{background:var(--bg2)!important;border-color:#888780!important}
.sel-g{background:#eaf3de!important;border-color:#639922!important;color:#3b6d11!important}
.sel-vg{background:#e1f5ee!important;border-color:#1d9e75!important;color:#0f6e56!important}
.sel-h{background:#faeeda!important;border-color:#ba7517!important;color:#854f0b!important}
.sel-ok{background:var(--bg2)!important;border-color:var(--border2)!important;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:0.5px solid var(--border);border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer;background:none;color:var(--text);font-family:'DM Sans',sans-serif}
.chip.sel{background:var(--info-bg);border-color:var(--info-text);color:var(--info-text)}
.sport-det{background:var(--bg2);border-radius:var(--r);padding:10px;margin-top:5px;display:flex;flex-direction:column;gap:8px}
.color-row{display:flex;gap:8px}
.cdot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent}
.cdot.sel{border-color:var(--text)}

/* ─── TO-DO FIXE ─── */
.todo-fixed{border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.todo-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:0.5px solid var(--border)}
.todo-row:last-child{border-bottom:none}
.todo-row:hover{background:var(--bg2)}
.todo-check{width:15px;height:15px;cursor:pointer;flex-shrink:0;accent-color:var(--text)}
.todo-label{font-size:13px;flex:1}
.todo-label.done{color:var(--text3);text-decoration:line-through}

/* ─── SOCIAL / BOOK ITEMS ─── */
.add-item{background:var(--bg2);border-radius:var(--r);padding:10px;margin-top:5px;display:flex;flex-direction:column;gap:7px}
.add-item-header{display:flex;align-items:center;justify-content:space-between}
.rm-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:0 2px;line-height:1}
.rm-btn:hover{color:var(--text2)}
.add-btn{font-size:12px;color:var(--text2);background:none;border:0.5px dashed var(--border2);border-radius:var(--r);padding:6px 12px;cursor:pointer;margin-top:4px;width:100%;font-family:'DM Sans',sans-serif}
.add-btn:hover{background:var(--bg2)}

/* ─── SAVE ─── */
.save-btn{background:var(--text);color:var(--bg);border:none;border-radius:var(--r);padding:10px 22px;font-size:13px;cursor:pointer;font-weight:500;margin-top:4px;font-family:'DM Sans',sans-serif}
.save-btn:hover{opacity:.85}
.save-msg{font-size:12px;color:var(--ok);margin-top:6px;display:none}

/* ─── STATS ─── */
.stat-tabs{display:flex;gap:6px;margin-bottom:14px}
.st{border:0.5px solid var(--border);border-radius:var(--r);padding:6px 14px;font-size:13px;cursor:pointer;background:none;color:var(--text2);font-family:'DM Sans',sans-serif}
.st.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.sc{background:var(--bg2);border-radius:var(--r);padding:12px 14px}
.sc-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.sc-val{font-size:22px;font-weight:500;line-height:1.1}
.sc-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sc.hl{background:#eaf3de;border:0.5px solid #97c459}
.sc.hl .sc-val,.sc.hl .sc-label{color:#27500a}.sc.hl .sc-sub{color:#639922}
.stitle{font-size:13px;font-weight:500;margin:16px 0 8px}
.warn-box{border:0.5px solid var(--warn-border);background:var(--warn-bg);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--warn-text);margin-bottom:7px}
.corr-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:12px}
.corr-row:last-child{border-bottom:none}
.cbar-w{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.cbar{height:100%;border-radius:3px}
.book-item{background:var(--bg2);border-radius:var(--r);padding:10px 12px;margin-bottom:6px}
.book-title{font-size:13px;font-weight:500}
.book-meta{font-size:12px;color:var(--text2)}
.book-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-top:4px}
.badge-loisir{background:#eeedfe;color:#3c3489}
.badge-capes{background:#fbeaf0;color:#72243e}

/* ─── BILAN SPORT ─── */
.hero-sport{background:var(--bg2);border-radius:var(--rl);padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-num{font-family:'DM Serif Display',serif;font-size:38px;color:#27500a;line-height:1}
.hero-label{font-size:11px;color:#3b6d11;font-weight:500;margin-bottom:3px}
.hero-eq{font-size:12px;color:var(--text2);margin-top:5px}
.progress-bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:4px}
.sport-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.sport-bar-name{min-width:95px;color:var(--text2);text-transform:capitalize}
.sport-bar-wrap{flex:1;height:9px;background:var(--bg3);border-radius:4px;overflow:hidden}
.sport-bar-fill{height:100%;border-radius:4px}
.sport-bar-val{min-width:52px;text-align:right;font-weight:500;font-size:12px}
.xp-card{border:0.5px solid var(--border);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
.xp-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:4px}
.xp-title{font-size:13px;font-weight:500}
.xp-badge{font-size:11px;padding:3px 9px;border-radius:20px}
.xp-footer{display:flex;justify-content:space-between;font-size:11px;margin-top:5px}
.cal-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:12px}
.cal-row:last-child{border-bottom:none}
.legend-row{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text2);margin-bottom:8px}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-sq{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.divider{height:0.5px;background:var(--border);margin:16px 0}
.chart-wrap{position:relative;width:100%}

/* ─── ENERGY SLIDER ─── */
.energy-row{display:flex;align-items:center;gap:10px}
.energy-row input[type=range]{flex:1;accent-color:var(--text)}
</style>
</head>
<body>
<div class="container">

<header class="app-header">
  <div class="app-title">Carnet de bord</div>

</div>

</div>

<div id="tab-sport" class="panel">
  <div id="sport-bilan"></div>
</div>

</div><!-- /container -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/* ════════════════════════════════════════
   CONSTANTES & DONNÉES DE RÉFÉRENCE
   ════════════════════════════════════════ */
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS_S=['Lu','Ma','Me','Je','Ve','Sa','Di'];
const MOODS=[{k:'vl',l:'Très basse'},{k:'l',l:'Basse'},{k:'n',l:'Neutre'},{k:'g',l:'Bonne'},{k:'vg',l:'Très bonne'},{k:'h',l:'Agitation'}];
const MOOD_LABELS={vl:'Très basse',l:'Basse',n:'Neutre',g:'Bonne',vg:'Très bonne',h:'Agitation'};
const MOOD_COLORS={vl:'#e24b4a',l:'#f09595',n:'#888780',g:'#639922',vg:'#1d9e75',h:'#ba7517'};
const SPORTS=['marche','escalade','natation','course','renforcement','vélo'];
const SPORT_COLORS={marche:'#378ADD',escalade:'#D85A30',natation:'#1D9E75',course:'#E24B4A',renforcement:'#7F77DD',vélo:'#BA7517'};
const SPORT_KCAL_MIN={marche:4.5,escalade:8,natation:8.5,course:10,renforcement:6,vélo:7};
const SPORT_FIELDS={
  marche:['durée (min)','distance (km)','pas','intensité','ressenti'],
  escalade:['durée (min)','niveau','voies/blocs','ressenti','douleur'],
  natation:['durée (min)','distance (m)','type séance','ressenti'],
  course:['durée (min)','distance (km)','allure','ressenti','douleur'],
  renforcement:['durée (min)','type séance','exercices','difficulté','ressenti'],
  vélo:['durée (min)','distance (km)','intensité','ressenti']
};
const FIXED_TODOS=[
  {key:'menage',label:'Ménage'},{key:'cuisine',label:'Cuisine'},
  {key:'rangement',label:'Rangement'},{key:'vaisselle',label:'Vaisselle'},
  {key:'commentaire',label:'Commentaire'},{key:'travail',label:'Travail'}
];
const ENTRAIN_OPTS=['dissertation','commentaire','oral','chronologie','plan détaillé','autre'];
const OBJ_KCAL_MONTH=7000;
const USER_HEIGHT_M=1.87;
const MEAL_KCAL_DEFAULTS={vert:1900,jaune:2300,orange:2800,rouge:3400,noir:0,gris:0};
const COCA_KCAL_PER_CAN=140;

/* ════════════════════════════════════════
   ÉTAT GLOBAL
   ════════════════════════════════════════ */
const now=new Date();
let curYear=now.getFullYear(),curMonth=now.getMonth(),selKey=null,curStat='week';
let sportChartWeekly=null,sportChartCumul=null,sportChartCompare=null;

/* ────── Chargement / sauvegarde localStorage + Dropbox ──────
   1) Crée une app sur https://www.dropbox.com/developers/apps
   2) Type : Scoped access / App folder
   3) Permissions : files.content.read + files.content.write
   4) Redirect URI : l'adresse exacte où tourne cette page, ex. http://localhost:8000/bullet_journal_v6_dropbox.html
   5) Remplace DROPBOX_APP_KEY ci-dessous par ton App key.
*/
const DROPBOX_APP_KEY='mimjsae5tdcsijp';
const DROPBOX_FILE_PATH='/carnet.json';
const DROPBOX_SCOPES='files.content.read files.content.write';
let dropboxAccessToken=localStorage.getItem('bj_dropbox_access_token')||null;
let dropboxTokenExpiresAt=+(localStorage.getItem('bj_dropbox_expires_at')||0);
let dropboxSaveTimer=null;

function loadData(){
  try{return JSON.parse(localStorage.getItem('bj_v3')||'{}')}catch(e){return {}}
}
function saveData(){
  localStorage.setItem('bj_v3',JSON.stringify(DATA));
  scheduleDropboxSave();
}
let DATA=loadData();

function currentRedirectUri(){return location.origin+location.pathname;}
function updateDropboxButton(txt,connected=false){
  const b=document.getElementById('dropbox-btn');
  if(!b)return;
  b.textContent=txt;
  b.classList.toggle('connected',connected);
}
function dropboxTokenValid(){return !!dropboxAccessToken && Date.now()<dropboxTokenExpiresAt-60000;}
function base64Url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function randomString(len=64){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const arr=new Uint8Array(len);crypto.getRandomValues(arr);
  return Array.from(arr,b=>chars[b%chars.length]).join('');
}
async function sha256(txt){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));}
async function connectDropbox(){
  if(DROPBOX_APP_KEY.startsWith('REMPLACE_MOI')){
    alert('Il faut d’abord créer une app Dropbox et remplacer DROPBOX_APP_KEY dans le HTML.');
    updateDropboxButton('Config Dropbox requise');return;
  }
  const verifier=randomString(96);
  const challenge=base64Url(await sha256(verifier));
  sessionStorage.setItem('bj_dropbox_code_verifier',verifier);
  const url=new URL('https://www.dropbox.com/oauth2/authorize');
  url.searchParams.set('client_id',DROPBOX_APP_KEY);
  url.searchParams.set('response_type','code');
  url.searchParams.set('code_challenge',challenge);
  url.searchParams.set('code_challenge_method','S256');
  url.searchParams.set('token_access_type','online');
  url.searchParams.set('scope',DROPBOX_SCOPES);
  url.searchParams.set('redirect_uri',currentRedirectUri());
  location.href=url.toString();
}
async function finishDropboxAuthIfNeeded(){
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  if(!code){
    updateDropboxButton(dropboxTokenValid()?'Dropbox connecté':'Connecter Dropbox',dropboxTokenValid());
    return;
  }
  const verifier=sessionStorage.getItem('bj_dropbox_code_verifier');
  history.replaceState({},document.title,currentRedirectUri());
  if(!verifier){updateDropboxButton('Dropbox à reconnecter');return;}
  try{
    updateDropboxButton('Connexion Dropbox…');
    const body=new URLSearchParams({
      code,grant_type:'authorization_code',client_id:DROPBOX_APP_KEY,
      code_verifier:verifier,redirect_uri:currentRedirectUri()
    });
    const res=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    if(!res.ok)throw new Error(await res.text());
    const tok=await res.json();
    dropboxAccessToken=tok.access_token;
    dropboxTokenExpiresAt=Date.now()+((tok.expires_in||14400)*1000);
    localStorage.setItem('bj_dropbox_access_token',dropboxAccessToken);
    localStorage.setItem('bj_dropbox_expires_at',String(dropboxTokenExpiresAt));
    sessionStorage.removeItem('bj_dropbox_code_verifier');
    updateDropboxButton('Dropbox connecté',true);
    await syncFromDropbox();
  }catch(e){console.error(e);updateDropboxButton('Erreur Dropbox');alert('Erreur de connexion Dropbox. Vérifie l’App key et le Redirect URI.');}
}
function disconnectDropbox(){
  dropboxAccessToken=null;dropboxTokenExpiresAt=0;
  localStorage.removeItem('bj_dropbox_access_token');localStorage.removeItem('bj_dropbox_expires_at');
  updateDropboxButton('Connecter Dropbox',false);
}
async function dropboxApi(url,opts={}){
  if(!dropboxTokenValid())throw new Error('Dropbox non connecté ou session expirée');
  const res=await fetch(url,{...opts,headers:{Authorization:`Bearer ${dropboxAccessToken}`,...(opts.headers||{})}});
  if(!res.ok)throw new Error(await res.text());
  return res;
}
async function syncFromDropbox(){
  if(!dropboxTokenValid()){updateDropboxButton('Connecter Dropbox');return;}
  try{
    updateDropboxButton('Lecture Dropbox…',true);
    const res=await dropboxApi('https://content.dropboxapi.com/2/files/download',{
      method:'POST',headers:{'Dropbox-API-Arg':JSON.stringify({path:DROPBOX_FILE_PATH})}
    });
    const remote=JSON.parse(await res.text());
    if(remote&&typeof remote==='object'){
      DATA=remote;localStorage.setItem('bj_v3',JSON.stringify(DATA));
      renderCal();renderStats();if(document.getElementById('tab-sport').classList.contains('active'))renderBilanSport();
      updateDropboxButton('Dropbox synchronisé',true);
    }
  }catch(e){
    const msg=String(e.message||e);
    if(msg.includes('path/not_found')){await uploadDropboxFile();return;}
    console.error(e);updateDropboxButton('Erreur lecture Dropbox',false);
  }
}
async function uploadDropboxFile(){
  if(!dropboxTokenValid())return;
  try{
    updateDropboxButton('Sauvegarde Dropbox…',true);
    await dropboxApi('https://content.dropboxapi.com/2/files/upload',{
      method:'POST',
      headers:{
        'Content-Type':'application/octet-stream',
        'Dropbox-API-Arg':JSON.stringify({path:DROPBOX_FILE_PATH,mode:'overwrite',autorename:false,mute:true,strict_conflict:false})
      },
      body:JSON.stringify(DATA,null,2)
    });
    updateDropboxButton('Dropbox sauvegardé',true);
  }catch(e){console.error(e);updateDropboxButton('Erreur save Dropbox',false);}
}
function scheduleDropboxSave(){
  if(!dropboxTokenValid())return;
  clearTimeout(dropboxSaveTimer);
  dropboxSaveTimer=setTimeout(uploadDropboxFile,900);
}
/* ════════════════════════════════════════
   UTILITAIRES
   ════════════════════════════════════════ */
function dk(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function moodCol(m){return MOOD_COLORS[m]||'#888780'}
function initDay(k){DATA[k]=DATA[k]||{sport:[],sportData:{},books:[],socialMeetings:[],fixedTodos:{}};return DATA[k]}
function sleepDur(s,e){
  if(!s||!e)return '—';
  const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let m=(eh*60+em)-(sh*60+sm);if(m<0)m+=1440;
  return `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;
}
function calcStars(d){
  let n=0;
  if(d.mood)n++;if(d.energy)n++;
  if(d.sport&&d.sport.length)n++;
  if(d.pages||d.writingNote)n++;
  if(d.fiches||d.capesNote||(d.entrains&&d.entrains.length))n++;
  if(d.journal||d.event||d.activity)n++;
  if(d.books&&d.books.length)n++;
  return n===0?0:n===1?1:n<=3?2:n<=5?3:4;
}
function renderStars(n){let s='';for(let i=1;i<=4;i++)s+=`<span class="${i<=n?'star-on':'star-off'}">★</span>`;return s;}

/* ════════════════════════════════════════
   CALENDRIER
   ════════════════════════════════════════ */
function renderCal(){
  document.getElementById('month-label').textContent=`${MONTHS[curMonth]} ${curYear}`;
  const g=document.getElementById('cal-grid');g.innerHTML='';
  DAYS_S.forEach(d=>{const h=document.createElement('div');h.className='cal-header';h.textContent=d;g.appendChild(h);});
  const first=new Date(curYear,curMonth,1).getDay();
  const off=(first===0?6:first-1),tot=new Date(curYear,curMonth+1,0).getDate();
  for(let i=0;i<off;i++){const e=document.createElement('div');e.className='cal-day empty';g.appendChild(e);}
  for(let d=1;d<=tot;d++){
    const k=dk(curYear,curMonth,d),day=DATA[k]||{};
    const isToday=now.getFullYear()===curYear&&now.getMonth()===curMonth&&now.getDate()===d;
    const el=document.createElement('div');
    el.className='cal-day'+(isToday?' today':'')+(selKey===k?' selected':'');
    const st=calcStars(day);
    let dots='';
    if(day.mood)dots+=`<div class="dot" style="background:${moodCol(day.mood)}"></div>`;
    if(day.sport&&day.sport.length)dots+=`<div class="dot" style="background:#185fa5"></div>`;
    if(day.pages||day.writingNote)dots+=`<div class="dot" style="background:#7f77dd"></div>`;
    if(day.fiches||day.capesNote)dots+=`<div class="dot" style="background:#d4537e"></div>`;
    if(day.books&&day.books.length)dots+=`<div class="dot" style="background:#534ab7"></div>`;
    el.innerHTML=`<div class="day-num">${d}</div><div class="day-dots">${dots}</div><div class="stars">${renderStars(st)}</div>`;
    el.onclick=()=>openDay(k,d);g.appendChild(el);
  }
}
function changeMonth(dir){
  curMonth+=dir;
  if(curMonth<0){curMonth=11;curYear--;}
  if(curMonth>11){curMonth=0;curYear++;}
  renderCal();
}
function openDay(k,d){
  selKey=k;renderCal();
  document.getElementById('cal-view').style.display='none';
  document.getElementById('sheet-view').style.display='block';
  buildSheet(k,d);
}
function showCal(){
  document.getElementById('cal-view').style.display='';
  document.getElementById('sheet-view').style.display='none';
  selKey=null;renderCal();
}

   HANDLERS FORMULAIRE

function toggleSec(h){const b=h.nextElementSibling;b.classList.toggle('open');h.querySelector('.sec-arrow').style.transform=b.classList.contains('open')?'rotate(180deg)':'';}
function setMood(k,m,btn){initDay(k).mood=m;btn.closest('.mood-btns').querySelectorAll('.mb').forEach(b=>b.className='mb');btn.className=`mb sel-${m}`;refreshSt(k);}
function setSleepQ(k,q,btn){initDay(k).sleepQ=q;btn.closest('.mood-btns').querySelectorAll('.mb').forEach(b=>b.className='mb');btn.className='mb sel-ok';}
function setMeal(k,c,dot){initDay(k).meal=c;dot.closest('.color-row').querySelectorAll('.cdot').forEach(d=>d.classList.remove('sel'));dot.classList.add('sel');}
function setCoca(k,v,btn){initDay(k).coca=v;btn.closest('.mood-btns').querySelectorAll('.mb').forEach(b=>b.className='mb');btn.className='mb sel-ok';}
function updSleep(k){const s=document.getElementById('ss-'+k).value,e=document.getElementById('se-'+k).value;initDay(k).sleepStart=s;initDay(k).sleepEnd=e;document.getElementById('sd-'+k).textContent=sleepDur(s,e);}
function toggleSport(k,s,btn){
  const day=initDay(k);day.sport=day.sport||[];
  const i=day.sport.indexOf(s);if(i>=0){day.sport.splice(i,1);btn.classList.remove('sel');}else{day.sport.push(s);btn.classList.add('sel');}
  const dd=document.getElementById('sdets-'+k);
  if(dd){let dets='';day.sport.forEach(sp=>{const f=SPORT_FIELDS[sp]||[],sd=(day.sportData&&day.sportData[sp])||{};dets+=`<div class="sport-det"><div style="font-size:12px;font-weight:500;margin-bottom:5px;text-transform:capitalize">${sp}</div>${f.map(fld=>`<div class="fl"><div class="lbl">${fld}</div><input type="text" value="${sd[fld]||''}" data-sport="${sp}" data-field="${fld}" oninput="updSportF('${k}',this)"></div>`).join('')}</div>`;});dd.innerHTML=dets;}
  refreshSt(k);
}

function showStat(p,btn){curStat=p;document.querySelectorAll('.st').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderStats(p);}

function statRange(period){
  const end=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let start=new Date(end);
  if(period==='week')start.setDate(end.getDate()-6);
  else if(period==='month')start=new Date(end.getFullYear(),end.getMonth(),1);
  else start=new Date(end.getFullYear(),0,1);
  return {start,end};
}
function parseDateKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function inRangeKey(k,start,end){const dt=parseDateKey(k);return dt>=start&&dt<=end;}
function mealCalories(d){if(d.mealKcal)return +d.mealKcal||0;return MEAL_KCAL_DEFAULTS[d.meal]||0;}
function cocaMl(d){if(d.cocaMl)return +d.cocaMl||0;return d.coca===true?330:0;}
function bmiForWeight(w){return w?Math.round((w/(USER_HEIGHT_M*USER_HEIGHT_M))*10)/10:null;}
function bmiLabel(b){if(!b)return '—';if(b<18.5)return 'sous la zone IMC';if(b<25)return 'zone IMC dite normale';if(b<30)return 'surpoids IMC';return 'obésité IMC';}
function latestWeight(entries){const vals=entries.filter(([,d])=>d.weight).sort(([a],[b])=>a.localeCompare(b));return vals.length?{date:vals[vals.length-1][0],weight:+vals[vals.length-1][1].weight}:null;}
function safeDaysBetween(a,b){if(!a||!b)return null;const da=new Date(a),db=new Date(b);if(Number.isNaN(+da)||Number.isNaN(+db)||db<da)return null;return Math.max(1,Math.round((db-da)/(24*3600*1000))+1);}
function funnyBookLine(b){const pages=+b.totalPages||+b.currentPage||0;const days=safeDaysBetween(b.startDate,b.endDate||new Date().toISOString().slice(0,10));const ppd=(pages&&days)?Math.round(pages/days*10)/10:null;if(!pages)return 'volume métaphysique sans pagination connue';if(ppd&&ppd>80)return `rythme TGV : ${ppd} pages/jour`;if(ppd&&ppd<10)return `lecture géologique : ${ppd} pages/jour`;if(ppd)return `cadence humaine : ${ppd} pages/jour`;return `${pages} pages dans la besace`;}

function parseSportNumber(v){
  if(v===undefined||v===null)return 0;
  const n=parseFloat(String(v).replace(',','.').replace(/[^0-9.\-]/g,''));
  return Number.isFinite(n)?n:0;
}
function extractSportEntriesFromData(year,month){
  const out=[];
  Object.entries(DATA).forEach(([key,day])=>{
    const m=key.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m||+m[1]!==year||(+m[2]-1)!==month||!day||!Array.isArray(day.sport))return;
    const dayNum=+m[3];
    day.sport.forEach(sport=>{
      const sd=(day.sportData&&day.sportData[sport])||{};
      const min=parseSportNumber(sd['durée (min)']||sd['duree (min)']||sd['durée']||sd['duree']);
      const dist=parseSportNumber(sd['distance (km)']||sd['distance (m)']);
      const voies=parseSportNumber(sd['voies/blocs']);
      out.push({day:dayNum,date:key,sport,min,dist,voies});
    });
  });
  return out.sort((a,b)=>a.day-b.day||a.sport.localeCompare(b.sport));
}

function renderBilanSport(){
  const targetYear=curYear,targetMonth=curMonth;
  const isCurrentMonth=targetYear===now.getFullYear()&&targetMonth===now.getMonth();
  const today=isCurrentMonth?now.getDate():new Date(targetYear,targetMonth+1,0).getDate();
  const daysInMonth=new Date(targetYear,targetMonth+1,0).getDate();
  const SPORT_ENTRIES=extractSportEntriesFromData(targetYear,targetMonth);

  /* ── Calculs par sport ── */
  const bySport={};
  const byDay={};
  SPORT_ENTRIES.forEach(s=>{
    if(!bySport[s.sport])bySport[s.sport]={min:0,kcal:0,sessions:0};
    bySport[s.sport].min+=s.min;
    bySport[s.sport].kcal+=Math.round(s.min*SPORT_KCAL_MIN[s.sport]);
    bySport[s.sport].sessions++;
    byDay[s.day]=byDay[s.day]||[];byDay[s.day].push(s);
  });

  const totalMin=Object.values(bySport).reduce((a,v)=>a+v.min,0);
  const totalKcal=Object.values(bySport).reduce((a,v)=>a+v.kcal,0);
  const totalSessions=SPORT_ENTRIES.length;
  const activeDays=[...new Set(SPORT_ENTRIES.map(s=>s.day))].length;
  const avgKcalDay=today?Math.round(totalKcal/today):0;
  const projectedKcal=Math.round(avgKcalDay*daysInMonth);
  const pct=Math.min(100,Math.round(totalKcal/OBJ_KCAL_MONTH*100));
  if(!SPORT_ENTRIES.length){
    document.getElementById('sport-bilan').innerHTML=`<div class="warn-box">Aucune entrée sport renseignée pour ${MONTHS[targetMonth]} ${targetYear}. Ajoute un sport dans une fiche quotidienne, puis renseigne au moins la durée pour alimenter les graphiques.</div>`;
    return;
  }

  /* ── HTML ── */
  const maxMin=Math.max(1,...Object.values(bySport).map(v=>v.min));
  const sportBarsHtml=Object.entries(bySport).sort((a,b)=>b[1].min-a[1].min).map(([sport,d])=>{
    const h=Math.floor(d.min/60),m=d.min%60;
    return `<div class="sport-bar-row">
      <span class="sport-bar-name">${sport}</span>
      <div class="sport-bar-wrap"><div class="sport-bar-fill" style="width:${Math.round(d.min/maxMin*100)}%;background:${SPORT_COLORS[sport]}"></div></div>
      <span class="sport-bar-val" style="color:${SPORT_COLORS[sport]}">${h>0?h+'h':''}${m>0?String(m).padStart(h>0?2:1,'0')+'min':''}</span>
    </div>`;}).join('');

  const projs=[
    {title:'À ce rythme exact',end:projectedKcal,color:'#639922',badge:'tendance'},
    {title:'Si +1 séance par semaine',end:Math.round(projectedKcal*1.18),color:'#1D9E75',badge:'objectif atteignable'},
    {title:'Si intensité ×1.2',end:Math.round(projectedKcal*1.2),color:'#185FA5',badge:'progression'},
    {title:'Mode max — 3 sports/j',end:Math.round(projectedKcal*1.35),color:'#7F77DD',badge:'max effort'},
  ];
  const projHtml=projs.map(p=>{
    const pp=Math.min(100,Math.round(p.end/OBJ_KCAL_MONTH*100));
    const diff=p.end-OBJ_KCAL_MONTH;
    return `<div class="xp-card">
      <div class="xp-header"><span class="xp-title">${p.title}</span><span class="xp-badge" style="background:${p.color}22;color:${p.color}">${p.badge}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="background:${p.color};width:${pp}%"></div></div>
      <div class="xp-footer">
        <span style="font-weight:500;color:${p.color}">${p.end.toLocaleString('fr-FR')} kcal</span>
        <span style="color:${diff>=0?'#3b6d11':'#a32d2d'}">${diff>=0?'+':''}${diff.toLocaleString('fr-FR')} vs objectif</span>
      </div></div>`;}).join('');

  function kcalEq(k){
    const km=Math.round(k/10);
    const pain=Math.round(k/270);
    if(km>=5)return `≈ ${km} km de course`;
    if(pain>=1)return `≈ ${pain} tranches de pain`;
    return `≈ ${Math.round(k/500)} repas`;
  }
  const calDetailHtml=Object.entries(bySport).sort((a,b)=>b[1].kcal-a[1].kcal).map(([sport,d])=>`
    <div class="cal-row">
      <div style="width:10px;height:10px;border-radius:50%;background:${SPORT_COLORS[sport]};flex-shrink:0"></div>
      <span style="flex:1;font-weight:500;text-transform:capitalize">${sport}</span>
      <span style="font-size:11px;color:var(--text2)">${d.sessions} séance${d.sessions>1?'s':''}</span>
      <span style="font-weight:500;color:#27500a">${d.kcal.toLocaleString('fr-FR')} kcal</span>
      <span style="font-size:11px;color:var(--text2);min-width:130px;text-align:right">${kcalEq(d.kcal)}</span>
    </div>`).join('');

  document.getElementById('sport-bilan').innerHTML=`
  <div class="hero-sport">
    <div style="flex:1;min-width:160px">
      <div class="hero-label">Calories brulées — ${MONTHS[targetMonth]} ${targetYear}</div>
      <div class="hero-num">${totalKcal.toLocaleString('fr-FR')} kcal</div>
      <div class="hero-eq">≈ ${Math.round(totalKcal/7700*10)/10} kg de graisse · ${Math.round(totalKcal/500)} repas</div>
    </div>
    <div style="flex:1;min-width:140px">
      <div style="font-size:11px;color:var(--text3);margin-bottom:3px">objectif mensuel — ${OBJ_KCAL_MONTH.toLocaleString('fr-FR')} kcal</div>
      <div class="progress-bar"><div class="progress-fill" style="background:${pct>=100?'#1d9e75':'#639922'};width:${pct}%"></div></div>
      <div style="font-size:13px;font-weight:500;color:${pct>=100?'#1d9e75':'#27500a'};margin-top:4px">${pct}% atteint</div>
    </div>
  </div>

  <div class="stat-grid">
    <div class="sc"><div class="sc-label">Séances totales</div><div class="sc-val">${totalSessions}</div></div>
    <div class="sc"><div class="sc-label">Jours actifs</div><div class="sc-val">${activeDays}</div><div class="sc-sub">sur ${today} jours</div></div>
    <div class="sc"><div class="sc-label">Temps total</div><div class="sc-val">${Math.floor(totalMin/60)}h${String(totalMin%60).padStart(2,'0')}</div></div>
    <div class="sc hl"><div class="sc-label">Projection fin de mois</div><div class="sc-val">${projectedKcal.toLocaleString('fr-FR')}</div><div class="sc-sub">kcal estimées</div></div>
  </div>

  <div class="stitle">Activité par sport — heures cumulées</div>
  ${sportBarsHtml}

  <div class="stitle">Volume semaine par semaine</div>
  <div class="legend-row" id="leg-weekly"></div>
  <div class="chart-wrap" style="height:200px"><canvas id="chart-weekly" role="img" aria-label="Minutes de sport par semaine et par type">Données sport hebdomadaires.</canvas></div>

  <div class="stitle">Calories brulées — cumulatif mensuel</div>
  <div class="legend-row">
    <span class="leg-item"><span class="leg-sq" style="background:#639922"></span>réel</span>
    <span class="leg-item"><span class="leg-sq" style="background:#1D9E75;border:0.5px dashed #1D9E75"></span>projection tendance</span>
    <span class="leg-item"><span class="leg-sq" style="background:#185FA5;border:0.5px dashed #185FA5"></span>projection ×1.2</span>
  </div>
  <div class="chart-wrap" style="height:220px"><canvas id="chart-cumul" role="img" aria-label="Courbe cumulative calories avec projections">Calories cumulées et projections.</canvas></div>

  <div class="stitle">Comparaison sports — durée vs calories</div>
  <div class="legend-row">
    <span class="leg-item"><span class="leg-sq" style="background:#185FA5"></span>durée (min)</span>
    <span class="leg-item"><span class="leg-sq" style="background:#1D9E75"></span>calories (÷5 pour l'échelle)</span>
  </div>
  <div class="chart-wrap" style="height:220px"><canvas id="chart-compare" role="img" aria-label="Durée vs calories par sport">Durée et calories comparées par sport.</canvas></div>

  <div class="divider"></div>
  <div class="stitle">Extrapolations — à ce rythme...</div>
  ${projHtml}

  <div class="divider"></div>
  <div class="stitle">Détail calorique par sport</div>
  ${calDetailHtml}`;

  /* ── Légende semaine ── */
  const legW=document.getElementById('leg-weekly');
  SPORTS.filter(s=>bySport[s]).forEach(s=>{legW.innerHTML+=`<span class="leg-item"><span class="leg-sq" style="background:${SPORT_COLORS[s]}"></span>${s}</span>`;});

  /* ── Chart semaine empilé ── */
  const weeks=[[1,7],[8,14],[15,21],[22,28],[29,31]];
  const weekLabels=weeks.map(([s,e],i)=>`S${i+1}`);
  const weekDatasets=SPORTS.filter(sp=>bySport[sp]).map(sport=>({
    label:sport,
    data:weeks.map(([s,e])=>SPORT_ENTRIES.filter(d=>d.sport===sport&&d.day>=s&&d.day<=Math.min(e,today)).reduce((a,d)=>a+d.min,0)),
    backgroundColor:SPORT_COLORS[sport]+'cc',borderColor:SPORT_COLORS[sport],borderWidth:0,stack:'w'
  }));

  if(sportChartWeekly){sportChartWeekly.destroy();}
  sportChartWeekly=new Chart(document.getElementById('chart-weekly'),{
    type:'bar',data:{labels:weekLabels,datasets:weekDatasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.y} min`}}},scales:{x:{stacked:true,ticks:{font:{size:11}}},y:{stacked:true,ticks:{font:{size:11}},title:{display:true,text:'min',font:{size:10}}}}}
  });

  /* ── Chart cumulatif avec projections ── */
  const days=Array.from({length:today},(_,i)=>i+1);
  let cumKcal=0;
  const cumulData=days.map(d=>{
    const dk2=(byDay[d]||[]).reduce((a,s)=>a+Math.round(s.min*SPORT_KCAL_MIN[s.sport]),0);
    cumKcal+=dk2;return cumKcal;
  });
  const slope=totalKcal/today;
  const allDaysRange=Array.from({length:daysInMonth},(_,i)=>i+1);
  const projT=allDaysRange.map(d=>d<=today?cumulData[d-1]:Math.round(totalKcal+(d-today)*slope));
  const projB=allDaysRange.map(d=>d<=today?cumulData[d-1]:Math.round(totalKcal+(d-today)*slope*1.2));

  if(sportChartCumul){sportChartCumul.destroy();}
  sportChartCumul=new Chart(document.getElementById('chart-cumul'),{
    type:'line',
    data:{labels:allDaysRange.map(d=>`${d}`),datasets:[
      {label:'réel',data:[...cumulData,...Array(daysInMonth-today).fill(null)],borderColor:'#639922',backgroundColor:'#eaf3de66',fill:true,tension:0.35,pointRadius:1.5,borderWidth:2.5},
      {label:'tendance',data:projT,borderColor:'#1D9E75',borderDash:[6,4],backgroundColor:'transparent',tension:0.35,pointRadius:0,borderWidth:1.5},
      {label:'x1.2',data:projB,borderColor:'#185FA5',borderDash:[3,4],backgroundColor:'transparent',tension:0.35,pointRadius:0,borderWidth:1.5},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${Math.round(ctx.parsed.y).toLocaleString('fr-FR')} kcal`}}},scales:{x:{ticks:{autoSkip:true,maxTicksLimit:10,font:{size:10}}},y:{ticks:{font:{size:10},callback:v=>v.toLocaleString('fr-FR')}}}}
  });

  /* ── Chart comparaison durée vs calories ── */
  const sportLabels=Object.keys(bySport);
  if(sportChartCompare){sportChartCompare.destroy();}
  sportChartCompare=new Chart(document.getElementById('chart-compare'),{
    type:'bar',
    data:{labels:sportLabels,datasets:[
      {label:'durée (min)',data:sportLabels.map(s=>bySport[s].min),backgroundColor:sportLabels.map(s=>SPORT_COLORS[s]+'bb'),borderColor:sportLabels.map(s=>SPORT_COLORS[s]),borderWidth:1},
      {label:'calories ÷5',data:sportLabels.map(s=>Math.round(bySport[s].kcal/5)),backgroundColor:'#1D9E7544',borderColor:'#1D9E75',borderWidth:1.5},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{if(ctx.datasetIndex===1)return `calories: ${(ctx.parsed.y*5).toLocaleString('fr-FR')} kcal`;return `durée: ${ctx.parsed.y} min`;}}}},scales:{x:{ticks:{font:{size:11},maxRotation:30}},y:{ticks:{font:{size:10}}}}}
  });
}

/* ════════════════════════════════════════
   EXPORT
   ════════════════════════════════════════ */
function exportJSON(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carnet_de_bord.json';a.click();
}

function importJSON(){
  const input=document.createElement('input');
  input.type='file';input.accept='application/json,.json';
  input.onchange=()=>{
    const file=input.files&&input.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const imported=JSON.parse(reader.result);
        if(!imported||typeof imported!=='object'||Array.isArray(imported))throw new Error('Format invalide');
        if(confirm('Remplacer les données locales par ce carnet JSON ?')){
          DATA=imported;saveData();renderCal();renderStats();
          if(document.getElementById('tab-sport').classList.contains('active'))renderBilanSport();
        }
      }catch(e){alert('Impossible d’importer ce JSON.');}
    };
    reader.readAsText(file);
  };
  input.click();
}

function exportCSV(){
  const rows=[['date','humeur','énergie','sport','pages_écrites','pages_relues','fiches_capes','sommeil_début','sommeil_fin','repas','calories_repas','coca_ml','poids','imc','médicaments']];
  Object.entries(DATA).sort(([a],[b])=>a.localeCompare(b)).forEach(([k,d])=>{
    rows.push([k,d.mood||'',d.energy||'',((d.sport||[]).join('|'))||'',d.pages||'',d.pagesRead||'',d.fiches||'',d.sleepStart||'',d.sleepEnd||'',d.meal||'',d.mealKcal||'',d.cocaMl||'',d.weight||'',d.weight?bmiForWeight(d.weight):'',(d.meds||'').replace(/,/g,' ')]);
  });
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carnet_de_bord.csv';a.click();
}

   INIT
   ════════════════════════════════════════ */
document.getElementById('header-date').textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
renderCal();
renderStats();
finishDropboxAuthIfNeeded();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.error));}
</script>
